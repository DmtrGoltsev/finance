components:
  securitySchemes:
    pwaCookieAuth:
      type: apiKey
      in: cookie
      name: __Host-finance_session
      description: HttpOnly Secure SameSite cookie used by the PWA.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for PWA cookie-authenticated state-changing requests; bound to the authenticated session and rotated on login/logout/reset.
    androidBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque bearer access token for Android; refresh token storage and rotation are platform secure-storage concerns.
  responses:
    Error:
      description: Canonical error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    AssetCategoryId:
      name: assetCategoryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    IncomeSourceId:
      name: incomeSourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Endpoint-specific allowlisted sort value.
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Search runs only after visible-scope filtering and is not logged as raw payload.
    StartDate:
      name: startDate
      in: query
      required: true
      schema: { $ref: '#/components/schemas/DateOnly' }
    EndDate:
      name: endDate
      in: query
      required: true
      schema: { $ref: '#/components/schemas/DateOnly' }
    Timezone:
      name: timezone
      in: query
      required: true
      schema:
        type: string
        example: Europe/Moscow
    Currency:
      name: currency
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CurrencyCode' }
    PlanningScopeRequired:
      name: scope
      in: query
      required: true
      schema: { $ref: '#/components/schemas/PlanningScope' }
    PlanningMonth:
      name: month
      in: query
      required: false
      schema: { $ref: '#/components/schemas/PlanMonth' }
      description: Calendar month accepted as YYYY-MM or YYYY-MM-01. Defaults to next month when omitted.
    HouseholdIdRequired:
      name: householdId
      in: query
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
      description: Required scope selector; it narrows access and never expands it.
    HouseholdIdFilter:
      name: householdId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ResourceId' }
      description: Optional scope narrowing only; inaccessible ids use neutral behavior.
    ReportHouseholdId:
      name: householdId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ResourceId' }
      description: Required for `shared_family_report` and `combined_viewer_overview`; omitted for `personal`.
    AccountIdFilter:
      name: accountId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ResourceId' }
    CategoryIdFilter:
      name: categoryId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ResourceId' }
    AccountIds:
      name: accountIds
      in: query
      required: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/ResourceId' }
      style: form
      explode: false
      description: All supplied ids must be visible in the selected report mode or the request fails neutrally.
    CategoryIds:
      name: categoryIds
      in: query
      required: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/ResourceId' }
      style: form
      explode: false
    TransactionTypes:
      name: transactionTypes
      in: query
      required: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/TransactionType' }
      style: form
      explode: false
    ReportMode:
      name: reportMode
      in: query
      required: true
      schema: { $ref: '#/components/schemas/ReportMode' }
    ReportBucket:
      name: bucket
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ReportBucket' }
    OwnershipTypeFilter:
      name: ownershipType
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OwnershipType' }
    CategoryScopeFilter:
      name: scope
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CategoryScope' }
    CategoryTypeFilter:
      name: type
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CategoryType' }
    TransactionTypeFilter:
      name: transactionType
      in: query
      required: false
      schema: { $ref: '#/components/schemas/TransactionType' }
    StatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RecordStatus' }
    AssetCategoryRecordStatusFilter:
      name: recordStatus
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RecordStatus' }
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_:-]+$'
      examples: [usr_123]
    DateTime:
      type: string
      format: date-time
      examples: ['2026-05-17T10:00:00Z']
    DateOnly:
      type: string
      format: date
      examples: ['2026-05-17']
    PlanMonth:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}(-01)?$'
      examples: ['2026-06', '2026-06-01']
      description: Calendar month accepted as YYYY-MM or YYYY-MM-01. Responses use YYYY-MM; server stores the first day of the month.
    DecimalString:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
      examples: ['1000.00']
      description: Decimal-safe money string; never floating point.
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [RUB]
    OwnershipType:
      type: string
      enum: [personal, shared]
    AccountType:
      type: string
      enum: [cash, bank, card, deposit, brokerage, metal, other]
    AssetCategoryType:
      type: string
      enum: [cash, bank, card, deposit, brokerage, metal, other]
    AssetCategoryScope:
      type: string
      enum: [personal, household]
    CategoryScope:
      type: string
      enum: [personal, household]
      description: Category scope uses `household`, not `shared`.
    CategoryType:
      type: string
      enum: [income, expense]
    PlanningScope:
      type: string
      enum: [personal, household]
    IncomeConfirmationState:
      type: string
      enum: [planned, confirmed]
    AllocationTargetType:
      type: string
      enum: [expense_category, account, asset, investment_asset_category]
      description: "`expense_category` targets expense categories; `investment_asset_category` targets active investment asset categories. `account` and `asset` are legacy-compatible account-backed targets."
    AllocationMode:
      type: string
      enum: [amount, percent]
    AllocationRecurrenceType:
      type: string
      enum: [regular, one_off]
    AllocationProgressStatus:
      type: string
      enum: [on_track, needs_attention, no_actuals, target_attention, not_applicable]
    TransactionType:
      type: string
      enum: [income, expense, transfer, brokerage, asset_buy, asset_sell, interest, dividend, adjustment]
    ReportMode:
      type: string
      enum: [personal, shared_family_report, combined_viewer_overview]
      description: "`personal` includes only the current viewer's personal owner scope; household modes require householdId."
    TransferScope:
      type: string
      enum: [personal_same_owner, household_same_household]
      description: Public accepted transfer scopes are same-scope only. Unsupported cross-scope attempts are rejected with TRANSFER_SCOPE_NOT_SUPPORTED.
    TransferStatus:
      type: string
      enum: [posted, voided]
    SourceType:
      type: string
      enum: [manual]
      description: MVP accepts only manual source. Reserved post-MVP values are rejected by create/update flows.
      x-reserved-post-mvp-values: [file_import, bank_api, sms, push]
    SyncEntityType:
      type: string
      enum:
        - transactions
        - accounts
        - categories
        - asset_categories
        - investment_migrations
        - planning_plans
        - planning_income_sources
        - planning_allocations
      description: MVP sync supports manual transactions, account/category/asset-category CRUD hooks, atomic investment_migrations:create, and offline-first planning CRUD hooks.
    SyncOperation:
      type: string
      enum: [create, update, archive, delete, restore, confirm]
    SyncMutationStatus:
      type: string
      enum: [applied, rejected]
    CaptureDraftStatus:
      type: string
      enum: [pending, confirmed, discarded]
    CaptureSource:
      type: string
      enum: [screenshot]
      description: Sanitized structured screenshot OCR capture source only; it is not a transaction sourceType.
    RecordStatus:
      type: string
      enum: [active, archived, deleted]
    ReportBucket:
      type: string
      enum: [day, month]
      default: month
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - SESSION_REVOKED
        - RESOURCE_NOT_FOUND_OR_NOT_ACCESSIBLE
        - REFERENCED_RESOURCE_NOT_FOUND_OR_NOT_ACCESSIBLE
        - ACTION_NOT_ALLOWED
        - MEMBERSHIP_NOT_ACTIVE
        - VALIDATION_FAILED
        - INVALID_ENUM_VALUE
        - INVALID_DATE_RANGE
        - INVALID_CURRENCY
        - ACCOUNT_OWNERSHIP_IMMUTABLE
        - CATEGORY_SCOPE_MISMATCH
        - TRANSACTION_ACCOUNT_MISMATCH
        - ARCHIVED_RECORD_NOT_MUTABLE
        - CONFLICTING_UPDATE
        - ACCOUNT_CURRENCY_IMMUTABLE_AFTER_TRANSACTIONS
        - TRANSFER_SCOPE_NOT_SUPPORTED
        - TRANSFER_COUNTERPARTY_REQUIRED
        - TRANSFER_COUNTERPARTY_NOT_ACCESSIBLE
        - TOO_MANY_REQUESTS
        - RATE_LIMITED
        - LOGIN_RATE_LIMITED
        - RESET_RATE_LIMITED
        - INVITE_RATE_LIMITED
        - UPLOAD_TOO_LARGE
        - IMAGE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_IMAGE
        - OCR_DISABLED
        - OCR_ENGINE_UNAVAILABLE
        - OCR_TIMEOUT
        - INVITE_NOT_FOUND_OR_NOT_ACCESSIBLE
        - INVITE_EXPIRED
        - INVITE_ALREADY_USED
        - INVITE_REVOKED
        - HOUSEHOLD_MEMBER_LIMIT_REACHED
        - RESET_TOKEN_NOT_FOUND_OR_EXPIRED
        - RESET_TOKEN_ALREADY_USED
        - PASSWORD_POLICY_FAILED
        - IDEMPOTENCY_KEY_REUSED
        - UNSUPPORTED_ENTITY_TYPE
        - UNSUPPORTED_OPERATION
        - UNSUPPORTED_TRANSACTION_TYPE
        - PAYLOAD_REQUIRED
        - BASE_VERSION_REQUIRED
        - ENTITY_ALREADY_EXISTS
    ErrorDetail:
      type: object
      description: Field-level details for caller-supplied invalid fields only; never includes hidden object names, amounts, emails, tokens, SQL, stack traces, or raw payloads.
      additionalProperties: false
      properties:
        field:
          type: string
        reason:
          type: string
        allowedValues:
          type: array
          items:
            type: string
    ErrorDto:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Safe generic user-facing message.
        requestId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDto'
    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, hasMore]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor scoped to visible filtered rows only.
        hasMore:
          type: boolean
      description: Pagination metadata never includes totalCount or hidden counts.
    UserDto:
      type: object
      additionalProperties: false
      required: [id, displayName, email, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        displayName:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          description: Full email is returned only for self profile/session responses.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        deactivatedAt:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
    AuthTransport:
      type: string
      enum: [pwa_cookie, android_bearer]
    UserRegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        transport:
          $ref: '#/components/schemas/AuthTransport'
          default: android_bearer
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
    RegistrationAcceptedResponse:
      type: object
      additionalProperties: false
      required: [registrationAccepted, message, requestId]
      properties:
        registrationAccepted:
          type: boolean
          const: true
        message:
          type: string
          description: Generic registration acceptance message; never confirms whether the email exists.
        requestId:
          type: string
    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        transport:
          $ref: '#/components/schemas/AuthTransport'
          default: android_bearer
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
    SessionRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
    ActorMembershipDto:
      type: object
      additionalProperties: false
      required: [householdId, status]
      properties:
        householdId:
          $ref: '#/components/schemas/ResourceId'
        status:
          type: string
    ActorContextDto:
      type: object
      additionalProperties: false
      required: [userId, memberships]
      properties:
        userId:
          $ref: '#/components/schemas/ResourceId'
        sessionId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/ActorMembershipDto'
    BearerSessionResponse:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, refreshToken, expiresAt, actor]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          minLength: 1
        refreshToken:
          type: string
          minLength: 1
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        actor:
          $ref: '#/components/schemas/ActorContextDto'
    PwaCookieSessionResponse:
      type: object
      additionalProperties: false
      required: [transport, csrfToken, expiresAt, actor]
      properties:
        transport:
          type: string
          const: pwa_cookie
        csrfToken:
          type: string
          minLength: 1
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        actor:
          $ref: '#/components/schemas/ActorContextDto'
    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          $ref: '#/components/schemas/ActorContextDto'
    SessionDto:
      type: object
      additionalProperties: false
      required: [user, sessionId, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
        sessionId:
          $ref: '#/components/schemas/ResourceId'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
    AccountDto:
      type: object
      additionalProperties: false
      required: [id, name, accountType, ownershipType, currency, initialBalance, currentBalance, isPaymentAccount, status, createdByUserId, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          maxLength: 120
        accountType:
          $ref: '#/components/schemas/AccountType'
        ownershipType:
          $ref: '#/components/schemas/OwnershipType'
        ownerUserId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
          description: Required for personal accounts; null for shared accounts.
        householdId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
          description: Required for shared accounts; null for personal accounts.
        assetCategoryId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
          description: Optional link to an active same-scope same-currency asset category.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        initialBalance:
          $ref: '#/components/schemas/DecimalString'
        currentBalance:
          $ref: '#/components/schemas/DecimalString'
        isPaymentAccount:
          type: boolean
          description: True when the account can be selected as an expense payment source, including capture-confirmed expenses. Income transactions are not blocked by this flag.
        status:
          $ref: '#/components/schemas/RecordStatus'
        createdByUserId:
          $ref: '#/components/schemas/ResourceId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        archivedAt:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        deletedAt:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        version:
          type: integer
          minimum: 1
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [name, accountType, ownershipType, currency, initialBalance]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        accountType:
          $ref: '#/components/schemas/AccountType'
        ownershipType:
          $ref: '#/components/schemas/OwnershipType'
        householdId:
          $ref: '#/components/schemas/ResourceId'
          description: Required when ownershipType is shared; ignored/rejected for personal per backend validation.
        assetCategoryId:
          $ref: '#/components/schemas/ResourceId'
          description: Optional active same-scope same-currency asset category.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        initialBalance:
          $ref: '#/components/schemas/DecimalString'
        isPaymentAccount:
          type: boolean
          default: true
          description: Defaults to true; set false for investment/display accounts that clients should omit from expense payment-source pickers. Income transactions are not blocked by this flag.
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        currentBalance:
          $ref: '#/components/schemas/DecimalString'
          description: Snapshot balance override. Does not mutate initialBalance.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Allowed only while no transaction references the account.
        accountType:
          $ref: '#/components/schemas/AccountType'
        assetCategoryId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
          description: Set or clear the optional asset category link.
        isPaymentAccount:
          type: boolean
          description: When false, clients should omit this account from expense payment-source pickers. Income transactions are not blocked by this flag.
        status:
          $ref: '#/components/schemas/RecordStatus'
        version:
          type: integer
          minimum: 1
      description: ownershipType, ownerUserId, and householdId are immutable in MVP.
    AccountAutocompleteDto:
      type: object
      additionalProperties: false
      required: [id, name, accountType, ownershipType, isPaymentAccount, currency]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        ownershipType:
          $ref: '#/components/schemas/OwnershipType'
        householdId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
        isPaymentAccount:
          type: boolean
          description: True when the account can be offered as an expense payment source; income selection is not restricted by this flag.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    AssetCategoryDto:
      type: object
      additionalProperties: false
      required: [id, name, scopeType, currency, assetType, manualAmount, isInvestment, recordStatus, createdByUserId, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          maxLength: 120
        scopeType:
          $ref: '#/components/schemas/AssetCategoryScope'
        ownerUserId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
        householdId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        assetType:
          $ref: '#/components/schemas/AssetCategoryType'
        iconKey:
          type: [string, 'null']
          maxLength: 80
        manualAmount:
          $ref: '#/components/schemas/DecimalString'
        isInvestment:
          type: boolean
        recordStatus:
          $ref: '#/components/schemas/RecordStatus'
        createdByUserId:
          $ref: '#/components/schemas/ResourceId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        archivedAt:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        deletedAt:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        version:
          type: integer
          minimum: 1
    AssetCategoryCreateRequest:
      type: object
      additionalProperties: false
      required: [name, scopeType, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopeType:
          $ref: '#/components/schemas/AssetCategoryScope'
        householdId:
          $ref: '#/components/schemas/ResourceId'
          description: Required for household scope; forbidden for personal.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        assetType:
          $ref: '#/components/schemas/AssetCategoryType'
          default: other
        iconKey:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
        manualAmount:
          $ref: '#/components/schemas/DecimalString'
          default: '0.0000'
        isInvestment:
          type: boolean
          default: false
    AssetCategoryUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        manualAmount:
          $ref: '#/components/schemas/DecimalString'
        assetType:
          $ref: '#/components/schemas/AssetCategoryType'
        iconKey:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
        isInvestment:
          type: boolean
        recordStatus:
          $ref: '#/components/schemas/RecordStatus'
        version:
          type: integer
          minimum: 1
    InvestmentMigrationCreateRequest:
      type: object
      additionalProperties: false
      required: [assetCategoryId, name, assetType, currency, accountIds, accountVersions]
      properties:
        assetCategoryId:
          $ref: '#/components/schemas/ResourceId'
          description: Client-provided ID for the asset category to create. For sync this must match mutation.entityId.
        name:
          type: string
          minLength: 1
          maxLength: 120
        icon:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
          description: Stored as asset category iconKey. Backend also accepts iconKey.
        color:
          type: [string, 'null']
          minLength: 1
          maxLength: 32
          description: Accepted for client command parity; not persisted by current asset category storage.
        assetType:
          $ref: '#/components/schemas/AssetCategoryType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        scope:
          $ref: '#/components/schemas/AssetCategoryScope'
          description: Optional. If omitted, derived from the validated accounts; backend also accepts scopeType.
        householdId:
          $ref: '#/components/schemas/ResourceId'
          description: Required for household scope unless derivable from shared accounts; forbidden for personal.
        accountIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ResourceId'
        accountVersions:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          description: Map of accountId to expected optimistic version. Keys must exactly match accountIds.
      description: |
        Creates an investment asset category with manualAmount=0 and isInvestment=true,
        then links all requested accounts without changing balances. Rejects stale
        account versions, linked accounts, mixed scope, mixed currency, or account
        type versus assetType mismatches before writing.
    PlanningSummaryDto:
      type: object
      additionalProperties: false
      required: [totalPlannedIncome, totalConfirmedIncome, totalAllocatedAmount, unallocatedAmount, previousMonthSurplus, underallocated, overallocated]
      properties:
        totalPlannedIncome:
          $ref: '#/components/schemas/DecimalString'
        totalConfirmedIncome:
          $ref: '#/components/schemas/DecimalString'
        totalAllocatedAmount:
          $ref: '#/components/schemas/DecimalString'
        unallocatedAmount:
          $ref: '#/components/schemas/DecimalString'
        previousMonthSurplus:
          $ref: '#/components/schemas/DecimalString'
          description: "Proposal-only positive surplus from the previous month: planned expense allocations minus actual expense transactions in the previous plan month, floored at zero. No transaction is created."
        underallocated:
          type: boolean
          description: True when totalAllocatedAmount is less than totalPlannedIncome.
        overallocated:
          type: boolean
          description: True when totalAllocatedAmount is greater than totalPlannedIncome. Saving overallocated plans is allowed.
    PlanningIncomeSourceDto:
      type: object
      additionalProperties: false
      required: [id, planId, amount, source, dayOfMonth, effectiveDate, confirmationState, createdByUserId, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        planId:
          $ref: '#/components/schemas/ResourceId'
        amount:
          $ref: '#/components/schemas/DecimalString'
        source:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: [string, 'null']
          maxLength: 500
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
        effectiveDate:
          $ref: '#/components/schemas/DateOnly'
          description: Date used for this plan month; day 31 falls back to the last day in shorter months.
        confirmationState:
          $ref: '#/components/schemas/IncomeConfirmationState'
        confirmedAt:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        confirmedByUserId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
        createdByUserId:
          $ref: '#/components/schemas/ResourceId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        version:
          type: integer
          minimum: 1
    PlanningAllocationDto:
      type: object
      additionalProperties: false
      required: [id, planId, targetType, targetSnapshot, requiresAttention, allocationMode, allocationValue, calculatedAmount, recurrenceType, isSavingsGoal, actualAmount, varianceAmount, status, createdByUserId, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        planId:
          $ref: '#/components/schemas/ResourceId'
        targetType:
          $ref: '#/components/schemas/AllocationTargetType'
        targetId:
          anyOf:
            - $ref: '#/components/schemas/ResourceId'
            - type: 'null'
          description: Null when a copied allocation target is missing or inaccessible and requiresAttention is true.
        targetSnapshot:
          type: object
          additionalProperties: true
          description: Non-authoritative display snapshot of the category/account/asset target at allocation creation or copy time.
        requiresAttention:
          type: boolean
        attentionReason:
          type: [string, 'null']
          examples: [TARGET_MISSING_OR_INACCESSIBLE]
        comment:
          type: [string, 'null']
          maxLength: 500
        allocationMode:
          $ref: '#/components/schemas/AllocationMode'
        allocationValue:
          $ref: '#/components/schemas/DecimalString'
          description: Amount value or percentage value depending on allocationMode.
        recurrenceType:
          $ref: '#/components/schemas/AllocationRecurrenceType'
          default: regular
        isSavingsGoal:
          type: boolean
          default: false
          description: When true, targetType must be investment_asset_category.
        goalTargetAmount:
          anyOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        goalDueMonth:
          anyOf:
            - $ref: '#/components/schemas/PlanMonth'
            - type: 'null'
        goalMonthlyAmount:
          anyOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
          description: Computed as goalTargetAmount divided across plan month through goalDueMonth when both are present.
        calculatedAmount:
          $ref: '#/components/schemas/DecimalString'
          description: Percent allocations are calculated from total planned income in the current plan response.
        actualAmount:
          $ref: '#/components/schemas/DecimalString'
          description: Actual matching transactions in the plan month. Expenses match by category; investment asset categories match active visible accounts linked by assetCategoryId.
        varianceAmount:
          $ref: '#/components/schemas/DecimalString'
          description: actualAmount minus calculatedAmount.
        status:
          $ref: '#/components/schemas/AllocationProgressStatus'
        createdByUserId:
          $ref: '#/components/schemas/ResourceId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
