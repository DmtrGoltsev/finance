openapi: 3.1.0
info:
  title: Finance MVP API
  version: 0.1.0
  summary: Canonical OpenAPI contract for the mounted closed-MVP runtime surface.
  license:
    name: Proprietary/Internal
    url: https://example.invalid/proprietary-internal-license
  description: |
    This document is the source of truth for the mounted MVP wire routes, DTO field names,
    enum values, error codes, pagination envelopes, and auth requirements.

    MVP boundaries are intentionally narrow: financial data is manual-entry only,
    `sourceType` accepts only `manual`, and transfers are same-scope only. Safe
    screenshot OCR capture may create pending drafts from sanitized structured
    candidates, but raw image bytes and OCR text are rejected and confirmed
    transactions remain `sourceType=manual`. There is no real import, parser,
    file storage, bank API, automated ingestion, broker credential, external
    credential, card, IBAN, raw statement, or device-token endpoint.

    Privacy invariants:
    - personal data is owner-only;
    - shared data is visible only to active members of the same Household;
    - reports use only `shared_family_report` and `combined_viewer_overview`;
    - every list, report, search, autocomplete, cache, count, and aggregation
      filters visible rows before any aggregation or pagination;
    - responses never expose hidden counts, filtered-out counts, hidden facets,
      or diagnostics that confirm inaccessible resources.
servers:
  - url: /api/v1
    description: MVP API prefix.
tags:
  - name: Auth
    description: Login, current session state, and current-session logout.
  - name: Accounts
    description: Manual personal and shared financial accounts visible to the caller.
  - name: Transactions
    description: Manual transaction entry, search, autocomplete, and lifecycle operations.
  - name: CaptureDrafts
    description: Pending screenshot OCR capture candidates plus transient server-side screenshot recognition. Raw OCR text is never accepted by structured draft endpoints or returned.
  - name: Categories
    description: Personal and household category management for manual finance records.
  - name: Reports
    description: Privacy-filtered MVP reports over visible manual financial data.
  - name: Planning
    description: Monthly personal and household planning; confirmations never create transactions.
security:
  - pwaCookieAuth: []
    csrfHeader: []
  - androidBearerAuth: []
paths:
  /users:
    post:
      tags: [Auth]
      operationId: createUser
      summary: Register user and create current session.
      description: Public registration endpoint. New users are created without financial bootstrap data and receive the same session runtime shape as login for the selected transport. Non-actionable or repeated registration requests return a neutral accepted response without token material and without confirming whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: Current session for the newly registered user.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BearerSessionResponse'
                  - $ref: '#/components/schemas/PwaCookieSessionResponse'
        '202':
          description: Neutral accepted registration response. No session or token material is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAcceptedResponse'
        '429':
          $ref: '#/components/responses/Error'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: Login and create current session.
      description: Account-neutral login. PWA receives HttpOnly cookie transport; Android receives bearer-capable token material by implementation policy.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Current session.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BearerSessionResponse'
                  - $ref: '#/components/schemas/PwaCookieSessionResponse'
        '429':
          $ref: '#/components/responses/Error'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /sessions/current:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      summary: Get current session.
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Auth]
      operationId: deleteCurrentSession
      summary: Logout current session.
      responses:
        '204':
          description: Current session revoked.
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List/search visible accounts.
      description: Personal accounts require ownerUserId=currentUserId. Shared accounts require active membership in the same household. No hidden counts are returned.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/OwnershipTypeFilter'
        - $ref: '#/components/parameters/HouseholdIdFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Visible accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPageEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create personal or shared account.
      description: "`ownershipType` is immutable after creation in MVP."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Created account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /accounts/autocomplete:
    get:
      tags: [Accounts]
      operationId: autocompleteAccounts
      summary: Autocomplete visible accounts.
      description: Minimal output only; no balances, hidden counts, or hidden match hints.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/OwnershipTypeFilter'
        - $ref: '#/components/parameters/HouseholdIdFilter'
      responses:
        '200':
          description: Account suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAutocompleteListEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get visible account detail.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update account mutable fields.
      description: Updates the account snapshot fields `name`, `currentBalance`, and `currency` with optional optimistic `version`; `initialBalance` is immutable. Currency cannot be changed after any transaction references the account.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '409':
          description: Conflict. Returned as `CONFLICTING_UPDATE` for stale `version`, or `ACCOUNT_CURRENCY_IMMUTABLE_AFTER_TRANSACTIONS` when changing currency after transactions exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Soft delete account if policy allows.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Account soft-deleted.
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{accountId}/archive:
    post:
      tags: [Accounts]
      operationId: archiveAccount
      summary: Archive account.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Archived account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{accountId}/restore:
    post:
      tags: [Accounts]
      operationId: restoreAccount
      summary: Restore archived account.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Restored account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List/search visible transactions.
      description: Transaction visibility inherits from visible account scope. Search, date, amount, and category filters apply after authz filtering.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AccountIdFilter'
        - $ref: '#/components/parameters/CategoryIdFilter'
        - $ref: '#/components/parameters/TransactionTypeFilter'
        - $ref: '#/components/parameters/HouseholdIdFilter'
        - $ref: '#/components/parameters/OwnershipTypeFilter'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Visible transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Create manual transaction.
      description: |
        `sourceType` must be `manual`. For transfers, `accountId` and
        `counterpartyAccountId` must form one allowed same-scope transfer:
        `personal_same_owner` or `household_same_household`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
      responses:
        '201':
          description: Created transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /transactions/autocomplete:
    get:
      tags: [Transactions]
      operationId: autocompleteTransactions
      summary: Autocomplete visible transactions.
      description: Minimal visible transaction labels only; no hidden matches or counts.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Transaction suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionAutocompleteListEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get visible transaction detail.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Update transaction mutable fields.
      description: Transfer updates must re-run full same-scope validation and cannot be partially applied.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdateRequest'
      responses:
        '200':
          description: Updated transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Soft delete transaction.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '204':
          description: Transaction soft-deleted or voided.
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /transactions/{transactionId}/restore:
    post:
      tags: [Transactions]
      operationId: restoreTransaction
      summary: Restore deleted transaction if allowed.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Restored transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /capture-drafts:
    get:
      tags: [CaptureDrafts]
      operationId: listCaptureDrafts
      summary: List current actor capture drafts.
      description: Returns only drafts owned by the authenticated actor. No hidden counts are returned.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CaptureDraftStatus'
      responses:
        '200':
          description: Current actor capture drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureDraftPageEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [CaptureDrafts]
      operationId: createCaptureDraft
      summary: Create pending capture draft.
      description: |
        Accepts only sanitized structured screenshot OCR candidates. Raw image
        bytes, raw OCR text, `body`, `text`, and other raw payload/body fields are
        not part of this schema and must be rejected. Reusing the same
        owner/idempotencyKey returns the existing draft without creating a
        duplicate row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureDraftCreateRequest'
      responses:
        '201':
          description: Created or existing idempotent capture draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureDraftEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /capture-drafts/screenshot-ocr:
    post:
      tags: [CaptureDrafts]
      operationId: recognizeCaptureDraftScreenshotOcr
      summary: Recognize category aggregate rows from a screenshot.
      description: |
        Authenticated server-side OCR endpoint for PWA/iOS screenshot capture.
        The screenshot upload is temporary, accepted only as PNG, JPEG, or WebP,
        and is not stored. The response contains structured candidates only and
        never returns raw OCR text, full OCR blocks, image bytes, or image hashes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScreenshotOcrRequest'
      responses:
        '200':
          description: Structured screenshot OCR candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenshotOcrEnvelope'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /capture-drafts/category-mappings:
    put:
      tags: [CaptureDrafts]
      operationId: putCaptureDraftCategoryMapping
      summary: Save a hash-only screenshot category mapping.
      description: |
        Stores only the authenticated actor, optional household context,
        selected category, and normalized external label hash. The submitted
        externalLabel is transient request input and is never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureCategoryMappingPutRequest'
      responses:
        '200':
          description: Stored category mapping without echoing externalLabel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureCategoryMappingEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /capture-drafts/{draftId}:
    patch:
      tags: [CaptureDrafts]
      operationId: updateCaptureDraft
      summary: Update pending capture draft candidate fields.
      description: Only pending drafts owned by the current actor can be changed.
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureDraftUpdateRequest'
      responses:
        '200':
          description: Updated capture draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureDraftEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /capture-drafts/{draftId}/confirm:
    post:
      tags: [CaptureDrafts]
      operationId: confirmCaptureDraft
      summary: Confirm capture draft as a manual transaction.
      description: Requires accountId, categoryId, amount, and description on the draft. Creates an expense transaction with `sourceType=manual`, then marks the draft confirmed with transactionId.
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Confirmed capture draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureDraftEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /capture-drafts/{draftId}/discard:
    post:
      tags: [CaptureDrafts]
      operationId: discardCaptureDraft
      summary: Discard pending capture draft.
      description: Only pending drafts owned by the current actor can be discarded.
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Discarded capture draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureDraftEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List/search visible categories.
      description: Personal categories are owner-only; household categories require active membership. Usage counts for hidden personal activity are never exposed.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CategoryScopeFilter'
        - $ref: '#/components/parameters/CategoryTypeFilter'
        - $ref: '#/components/parameters/HouseholdIdFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Visible categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPageEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create personal or household category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Created category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /categories/autocomplete:
    get:
      tags: [Categories]
      operationId: autocompleteCategories
      summary: Autocomplete visible categories.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CategoryScopeFilter'
        - $ref: '#/components/parameters/CategoryTypeFilter'
        - $ref: '#/components/parameters/HouseholdIdFilter'
      responses:
        '200':
          description: Category suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAutocompleteListEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /categories/{categoryId}:
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get visible category detail.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Update category mutable fields.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Soft delete category if history remains coherent.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category soft-deleted.
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /categories/{categoryId}/archive:
    post:
      tags: [Categories]
      operationId: archiveCategory
      summary: Archive category.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Archived category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /categories/{categoryId}/restore:
    post:
      tags: [Categories]
      operationId: restoreCategory
      summary: Restore category.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Restored category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /reports/summary:
    get:
      tags: [Reports]
      operationId: getReportSummary
      summary: Get summary report for visible rows.
      description: Computes totals only after resolving visibleAccountIds for the selected report mode.
      parameters:
        - $ref: '#/components/parameters/ReportMode'
        - $ref: '#/components/parameters/HouseholdIdRequired'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/AccountIds'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/TransactionTypes'
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          description: Report summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummaryEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /reports/category-breakdown:
    get:
      tags: [Reports]
      operationId: getReportCategoryBreakdown
      summary: Get category breakdown for visible rows.
      description: Category buckets and transactionCount use only visible filtered transactions.
      parameters:
        - $ref: '#/components/parameters/ReportMode'
        - $ref: '#/components/parameters/HouseholdIdRequired'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/AccountIds'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/TransactionTypes'
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          description: Category breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCategoryBreakdownEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /reports/account-balances:
    get:
      tags: [Reports]
      operationId: getReportAccountBalances
      summary: Get balances for visible accounts.
      description: Never includes personal accounts of another household member, including sorting/min/max/cache behavior.
      parameters:
        - $ref: '#/components/parameters/ReportMode'
        - $ref: '#/components/parameters/HouseholdIdRequired'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/AccountIds'
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          description: Account balances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportAccountBalancesEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /reports/cash-flow:
    get:
      tags: [Reports]
      operationId: getReportCashFlow
      summary: Get cash-flow trend for visible rows.
      parameters:
        - $ref: '#/components/parameters/ReportMode'
        - $ref: '#/components/parameters/HouseholdIdRequired'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/ReportBucket'
        - $ref: '#/components/parameters/AccountIds'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/TransactionTypes'
        - $ref: '#/components/parameters/Currency'
      responses:
        '200':
          description: Cash-flow report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCashFlowEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /reports/transactions:
    get:
      tags: [Reports]
      operationId: getReportTransactions
      summary: Get report drill-down transactions.
      description: Every returned row must pass regular transaction list/detail predicates for the same actor.
      parameters:
        - $ref: '#/components/parameters/ReportMode'
        - $ref: '#/components/parameters/HouseholdIdRequired'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Timezone'
        - $ref: '#/components/parameters/AccountIds'
        - $ref: '#/components/parameters/CategoryIds'
        - $ref: '#/components/parameters/TransactionTypes'
        - $ref: '#/components/parameters/Currency'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Report transaction drill-down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTransactionDrillDownEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/plans:
    get:
      tags: [Planning]
      operationId: getPlanningPlanForScopeMonth
      summary: Get plan for scope and month.
      description: Resolves personal owner-only or household active-membership scope before loading income sources, allocations, or totals. If month is omitted, the server uses the next calendar month.
      parameters:
        - $ref: '#/components/parameters/PlanningScopeRequired'
        - $ref: '#/components/parameters/PlanningMonth'
        - $ref: '#/components/parameters/HouseholdIdFilter'
      responses:
        '200':
          description: Planning plan for the requested scope/month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningPlanEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Planning]
      operationId: createPlanningPlan
      summary: Create personal or household monthly plan.
      description: A plan has one currency and one scope. Duplicate scope/month plans return conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningPlanCreateRequest'
      responses:
        '201':
          description: Created planning plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningPlanEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/plans/history:
    get:
      tags: [Planning]
      operationId: listPlanningPlanHistory
      summary: List historical plans for a scope.
      description: Returns visible plan summaries sorted by month descending; no hidden counts are exposed.
      parameters:
        - $ref: '#/components/parameters/PlanningScopeRequired'
        - $ref: '#/components/parameters/HouseholdIdFilter'
      responses:
        '200':
          description: Visible planning history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningPlanSummaryListEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/plans/{planId}:
    get:
      tags: [Planning]
      operationId: getPlanningPlan
      summary: Get visible planning plan.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Planning plan detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningPlanEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/plans/{planId}/income-sources:
    post:
      tags: [Planning]
      operationId: createPlanningIncomeSource
      summary: Add planned income source.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningIncomeSourceCreateRequest'
      responses:
        '201':
          description: Created income source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningIncomeSourceEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/plans/{planId}/allocations:
    post:
      tags: [Planning]
      operationId: createPlanningAllocation
      summary: Add amount or percent allocation.
      description: Target must be a visible same-scope expense category, same-currency account, or same-currency account-backed asset/investment. Overallocated plans are allowed and surfaced through derived flags.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningAllocationCreateRequest'
      responses:
        '201':
          description: Created allocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningAllocationEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/plans/{planId}/copy:
    post:
      tags: [Planning]
      operationId: copyPlanningPlan
      summary: Copy plan to another month.
      description: Copies income sources and allocations, preserving allocation mode/value. Missing or inaccessible targets become requiresAttention rows with targetSnapshot; no category/account/asset/transaction is auto-created.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningPlanCopyRequest'
      responses:
        '201':
          description: Copied planning plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningPlanEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/income-sources/{incomeSourceId}:
    patch:
      tags: [Planning]
      operationId: updatePlanningIncomeSource
      summary: Update planned income source.
      parameters:
        - $ref: '#/components/parameters/IncomeSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningIncomeSourceUpdateRequest'
      responses:
        '200':
          description: Updated income source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningIncomeSourceEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Planning]
      operationId: deletePlanningIncomeSource
      summary: Delete planned income source.
      parameters:
        - $ref: '#/components/parameters/IncomeSourceId'
      responses:
        '204':
          description: Income source deleted.
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/income-sources/{incomeSourceId}/confirm:
    post:
      tags: [Planning]
      operationId: confirmPlanningIncomeSource
      summary: Confirm income source in planning only.
      description: Sets confirmation state and audit-ish actor fields on the planning row only. It does not create transactions or mutate balances.
      parameters:
        - $ref: '#/components/parameters/IncomeSourceId'
      responses:
        '200':
          description: Confirmed income source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningIncomeSourceEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /planning/allocations/{allocationId}:
    patch:
      tags: [Planning]
      operationId: updatePlanningAllocation
      summary: Update allocation.
      parameters:
        - $ref: '#/components/parameters/AllocationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningAllocationUpdateRequest'
      responses:
        '200':
          description: Updated allocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningAllocationEnvelope'
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Planning]
      operationId: deletePlanningAllocation
      summary: Delete allocation.
      parameters:
        - $ref: '#/components/parameters/AllocationId'
      responses:
        '204':
          description: Allocation deleted.
        '4XX':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    pwaCookieAuth:
      type: apiKey
      in: cookie
      name: __Host-finance_session
      description: HttpOnly Secure SameSite cookie used by the PWA.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for PWA cookie-authenticated state-changing requests; bound to the authenticated session and rotated on login/logout/reset.
    androidBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Opaque bearer access token for Android; refresh token storage and rotation are platform secure-storage concerns.
  responses:
    Error:
      description: Canonical error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    IncomeSourceId:
      name: incomeSourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Endpoint-specific allowlisted sort value.
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Search runs only after visible-scope filtering and is not logged as raw payload.
    StartDate:
      name: startDate
      in: query
      required: true
      schema: { $ref: '#/components/schemas/DateOnly' }
    EndDate:
      name: endDate
      in: query
      required: true
      schema: { $ref: '#/components/schemas/DateOnly' }
    Timezone:
      name: timezone
      in: query
      required: true
      schema:
        type: string
        example: Europe/Moscow
    Currency:
      name: currency
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CurrencyCode' }
    PlanningScopeRequired:
      name: scope
      in: query
      required: true
      schema: { $ref: '#/components/schemas/PlanningScope' }
    PlanningMonth:
      name: month
      in: query
      required: false
      schema: { $ref: '#/components/schemas/PlanMonth' }
      description: Calendar month in YYYY-MM form. Defaults to next month when omitted.
    HouseholdIdRequired:
      name: householdId
      in: query
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
      description: Required scope selector; it narrows access and never expands it.
    HouseholdIdFilter:
      name: householdId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ResourceId' }
      description: Optional scope narrowing only; inaccessible ids use neutral behavior.
    AccountIdFilter:
      name: accountId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ResourceId' }
    CategoryIdFilter:
      name: categoryId
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ResourceId' }
    AccountIds:
      name: accountIds
      in: query
      required: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/ResourceId' }
      style: form
      explode: false
      description: All supplied ids must be visible in the selected report mode or the request fails neutrally.
    CategoryIds:
      name: categoryIds
      in: query
      required: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/ResourceId' }
      style: form
      explode: false
    TransactionTypes:
      name: transactionTypes
      in: query
      required: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/TransactionType' }
      style: form
      explode: false
    ReportMode:
      name: reportMode
      in: query
      required: true
      schema: { $ref: '#/components/schemas/ReportMode' }
    ReportBucket:
      name: bucket
      in: query
      required: false
      schema: { $ref: '#/components/schemas/ReportBucket' }
    OwnershipTypeFilter:
      name: ownershipType
      in: query
      required: false
      schema: { $ref: '#/components/schemas/OwnershipType' }
    CategoryScopeFilter:
      name: scope
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CategoryScope' }
    CategoryTypeFilter:
      name: type
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CategoryType' }
    TransactionTypeFilter:
      name: transactionType
      in: query
      required: false
      schema: { $ref: '#/components/schemas/TransactionType' }
    StatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RecordStatus' }
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_:-]+$'
      examples: [usr_123]
    DateTime:
      type: string
      format: date-time
      examples: ['2026-05-17T10:00:00Z']
    DateOnly:
      type: string
      format: date
      examples: ['2026-05-17']
    PlanMonth:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}$'
      examples: ['2026-06']
      description: Calendar month encoded as YYYY-MM. Server stores the first day of the month.
    DecimalString:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
      examples: ['1000.00']
      description: Decimal-safe money string; never floating point.
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [RUB]
    OwnershipType:
      type: string
      enum: [personal, shared]
    AccountType:
      type: string
      enum: [cash, bank, card, deposit, brokerage, metal, other]
    CategoryScope:
      type: string
      enum: [personal, household]
      description: Category scope uses `household`, not `shared`.
    CategoryType:
      type: string
      enum: [income, expense]
    PlanningScope:
      type: string
      enum: [personal, household]
    IncomeConfirmationState:
      type: string
      enum: [planned, confirmed]
    AllocationTargetType:
      type: string
      enum: [expense_category, account, asset]
      description: "`expense_category` targets expense categories; `account` preserves existing account targets; `asset` explicitly targets an account-backed asset or investment."
    AllocationMode:
      type: string
      enum: [amount, percent]
    TransactionType:
      type: string
      enum: [income, expense, transfer, brokerage, asset_buy, asset_sell, interest, dividend, adjustment]
    ReportMode:
      type: string
      enum: [shared_family_report, combined_viewer_overview]
      description: The only two report modes in MVP.
    TransferScope:
      type: string
      enum: [personal_same_owner, household_same_household]
      description: Public accepted transfer scopes are same-scope only. Unsupported cross-scope attempts are rejected with TRANSFER_SCOPE_NOT_SUPPORTED.
    TransferStatus:
      type: string
      enum: [posted, voided]
    SourceType:
      type: string
      enum: [manual]
      description: MVP accepts only manual source. Reserved post-MVP values are rejected by create/update flows.
      x-reserved-post-mvp-values: [file_import, bank_api, sms, push]
    CaptureDraftStatus:
      type: string
      enum: [pending, confirmed, discarded]
    CaptureSource:
      type: string
      enum: [screenshot]
      description: Sanitized structured screenshot OCR capture source only; it is not a transaction sourceType.
    RecordStatus:
      type: string
      enum: [active, archived, deleted]
    ReportBucket:
      type: string
      enum: [day, month]
      default: month
    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - SESSION_REVOKED
        - RESOURCE_NOT_FOUND_OR_NOT_ACCESSIBLE
        - REFERENCED_RESOURCE_NOT_FOUND_OR_NOT_ACCESSIBLE
        - ACTION_NOT_ALLOWED
        - MEMBERSHIP_NOT_ACTIVE
        - VALIDATION_FAILED
        - INVALID_ENUM_VALUE
        - INVALID_DATE_RANGE
        - INVALID_CURRENCY
        - ACCOUNT_OWNERSHIP_IMMUTABLE
        - CATEGORY_SCOPE_MISMATCH
        - TRANSACTION_ACCOUNT_MISMATCH
        - ARCHIVED_RECORD_NOT_MUTABLE
        - CONFLICTING_UPDATE
        - ACCOUNT_CURRENCY_IMMUTABLE_AFTER_TRANSACTIONS
        - TRANSFER_SCOPE_NOT_SUPPORTED
        - TRANSFER_COUNTERPARTY_REQUIRED
        - TRANSFER_COUNTERPARTY_NOT_ACCESSIBLE
        - TOO_MANY_REQUESTS
        - RATE_LIMITED
        - LOGIN_RATE_LIMITED
        - RESET_RATE_LIMITED
        - INVITE_RATE_LIMITED
        - UPLOAD_TOO_LARGE
        - IMAGE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_IMAGE
        - OCR_DISABLED
        - OCR_ENGINE_UNAVAILABLE
        - OCR_TIMEOUT
        - INVITE_NOT_FOUND_OR_NOT_ACCESSIBLE
        - INVITE_EXPIRED
        - INVITE_ALREADY_USED
        - INVITE_REVOKED
        - HOUSEHOLD_MEMBER_LIMIT_REACHED
        - RESET_TOKEN_NOT_FOUND_OR_EXPIRED
        - RESET_TOKEN_ALREADY_USED
        - PASSWORD_POLICY_FAILED
    ErrorDetail:
      type: object
      description: Field-level details for caller-supplied invalid fields only; never includes hidden object names, amounts, emails, tokens, SQL, stack traces, or raw payloads.
      additionalProperties: false
      properties:
        field:
          type: string
        reason:
          type: string
        allowedValues:
          type: array
          items:
            type: string
    ErrorDto:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Safe generic user-facing message.
        requestId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDto'
    PageInfo:
      type: object
      additionalProperties: false
      required: [limit, hasMore]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor scoped to visible filtered rows only.
        hasMore:
          type: boolean
      description: Pagination metadata never includes totalCount or hidden counts.
    UserDto:
      type: object
      additionalProperties: false
      required: [id, displayName, email, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        displayName:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          description: Full email is returned only for self profile/session responses.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        deactivatedAt:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
    AuthTransport:
      type: string
      enum: [pwa_cookie, android_bearer]
    UserRegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        transport:
          $ref: '#/components/schemas/AuthTransport'
          default: android_bearer
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
    RegistrationAcceptedResponse:
      type: object
      additionalProperties: false
      required: [registrationAccepted, message, requestId]
      properties:
        registrationAccepted:
          type: boolean
          const: true
        message:
          type: string
          description: Generic registration acceptance message; never confirms whether the email exists.
        requestId:
          type: string
    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        transport:
          $ref: '#/components/schemas/AuthTransport'
          default: android_bearer
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
    ActorMembershipDto:
      type: object
      additionalProperties: false
      required: [householdId, status]
      properties:
        householdId:
          $ref: '#/components/schemas/ResourceId'
        status:
          type: string
    ActorContextDto:
      type: object
      additionalProperties: false
