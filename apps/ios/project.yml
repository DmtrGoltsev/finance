name: FinanceApp
configs:
  Debug: debug
  Release: release
  PersonalSideloadHTTP: release
options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      FINANCE_API_BASE_URL: "http://127.0.0.1:8000/finance-api"
    Release:
      FINANCE_API_BASE_URL: "$(FINANCE_RELEASE_API_BASE_URL)"

targets:
  FinanceApp:
    type: application
    platform: iOS
    sources:
      - path: FinanceApp
        excludes:
          - "**/.DS_Store"
          - "Info-Debug.plist"
          - "Info-PersonalSideloadHTTP.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.FinanceApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: FinanceApp/Info.plist
      configs:
        Debug:
          INFOPLIST_FILE: FinanceApp/Info-Debug.plist
        PersonalSideloadHTTP:
          FINANCE_API_BASE_URL: "$(FINANCE_RELEASE_API_BASE_URL)"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    info:
      path: FinanceApp/Info.plist

  FinanceAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinanceAppTests
    dependencies:
      - target: FinanceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.FinanceAppTests
        GENERATE_INFOPLIST_FILE: true

  FinanceAppPersonalHTTP:
    type: application
    platform: iOS
    sources:
      - path: FinanceApp
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "Info-Debug.plist"
          - "Info-PersonalSideloadHTTP.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.FinanceApp.PersonalSideload
        # Keep the installable product distinct from the normal FinanceApp target.
        # The user-facing name is defined by the dedicated personal Info.plist.
        PRODUCT_NAME: FinanceAppPersonalHTTP
        PRODUCT_MODULE_NAME: FinanceApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: FinanceApp/Info-PersonalSideloadHTTP.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
      configs:
        PersonalSideloadHTTP:
          FINANCE_API_BASE_URL: "http://45.10.110.42/finance-api"
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PERSONAL_SIDELOAD_HTTP"
    info:
      path: FinanceApp/Info-PersonalSideloadHTTP.plist

  FinanceAppPersonalHTTPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinanceAppTests/PersonalSideloadHTTPTests.swift
    dependencies:
      - target: FinanceAppPersonalHTTP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.FinanceApp.PersonalSideloadTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FinanceAppPersonalHTTP.app/FinanceAppPersonalHTTP"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        PersonalSideloadHTTP:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PERSONAL_SIDELOAD_HTTP"

  FinanceAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FinanceAppUITests
    dependencies:
      - target: FinanceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.FinanceAppUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FinanceApp

schemes:
  FinanceApp:
    build:
      targets:
        FinanceApp: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: FinanceAppTests
          parallelizable: false
        - name: FinanceAppUITests
          parallelizable: false
    archive:
      config: Release
  FinanceAppPersonalHTTP:
    build:
      targets:
        FinanceAppPersonalHTTP: all
    run:
      config: PersonalSideloadHTTP
    test:
      config: PersonalSideloadHTTP
      gatherCoverageData: true
      targets:
        - name: FinanceAppPersonalHTTPTests
          parallelizable: false
