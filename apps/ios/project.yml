name: FinanceApp
options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      FINANCE_API_BASE_URL: "http://127.0.0.1:8000/finance-api"
    Release:
      FINANCE_API_BASE_URL: "$(FINANCE_RELEASE_API_BASE_URL)"

targets:
  FinanceApp:
    type: application
    platform: iOS
    sources:
      - path: FinanceApp
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.FinanceApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: FinanceApp/Info.plist
    info:
      path: FinanceApp/Info.plist
