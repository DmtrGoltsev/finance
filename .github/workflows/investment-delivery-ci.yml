name: Investment Delivery CI
on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/android/**'
      - 'db/migrations/**'
      - 'ops/finance-delivery/**'
      - 'ops/finance-n8n/**'
      - 'api/openapi/**'
      - '.github/workflows/investment-delivery-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: delivery_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e 'apps/backend[dev]' pyyaml
      - working-directory: apps/backend
        run: >-
          python -m ruff check src/app/delivery tests/delivery
          ../../db/migrations/versions/20260920_0024_delivery.py
          ../../db/migrations/versions/20260921_0025_ready_callback_hash.py
      - name: Concurrent claims and mocked deliveries on PostgreSQL
        working-directory: apps/backend
        env:
          FINANCE_DELIVERY_TEST_POSTGRES_URL: postgresql+psycopg://delivery_test:ci-only-password@localhost:5432/delivery_test
        run: python -m pytest tests/delivery -q
      - name: Investment API contract
        working-directory: apps/backend
        run: python -m pytest tests/investments/test_openapi_exhaustive.py -q
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: ops/finance-n8n
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Gateway deduplication and lost ACK regression
        working-directory: ops/finance-n8n
        env:
          BACKEND_HMAC_MODULE: ${{ github.workspace }}/apps/backend/src/app/investments/hmac_auth.py
        run: npm test
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: apps/android
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin -PfinancePushEnabled=false
