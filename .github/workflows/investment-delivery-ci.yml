name: Investment Delivery CI
on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/android/**'
      - 'db/migrations/**'
      - 'ops/finance-delivery/**'
      - '.github/workflows/investment-delivery-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: delivery_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U delivery_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e 'apps/backend[dev]' pyyaml
      - run: python -m ruff check apps/backend/src/app/delivery apps/backend/tests/delivery db/migrations/versions/20260920_0024_delivery.py
      - name: Concurrent claims and mocked deliveries on PostgreSQL
        working-directory: apps/backend
        env:
          FINANCE_DELIVERY_TEST_POSTGRES_URL: postgresql+psycopg://delivery_test:ci-only-password@localhost:5432/delivery_test
        run: python -m pytest tests/delivery -q
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: apps/android
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin -PfinancePushEnabled=false
