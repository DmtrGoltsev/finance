name: Finance Production Password Rotation

on:
  workflow_dispatch:
    inputs:
      confirm_password_rotation:
        description: "Required. Enter finance-production-rotate-password."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finance-prod-password-rotation
  cancel-in-progress: false

jobs:
  validate-owner-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate owner and exact confirmation
        env:
          FINANCE_ACTOR: ${{ github.actor }}
          FINANCE_CONFIRMATION: ${{ inputs.confirm_password_rotation }}
          FINANCE_REF_NAME: ${{ github.ref_name }}
          FINANCE_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${FINANCE_ACTOR}" != "DmtrGoltsev" ]; then
            echo "::error::Only the repository owner may rotate the production password."
            exit 1
          fi
          if [ "${FINANCE_CONFIRMATION}" != "finance-production-rotate-password" ]; then
            echo "::error::confirm_password_rotation must match the required phrase."
            exit 1
          fi
          if [ "${FINANCE_REF_TYPE}" != "tag" ]; then
            echo "::error::Production password rotation must run from an approved tag."
            exit 1
          fi
          case "${FINANCE_REF_NAME}" in
            prod/release-password-rotation-*) ;;
            *)
              echo "::error::Tag must start with prod/release-password-rotation-."
              exit 1
              ;;
          esac
          echo "Production password rotation intent validated."

  rotate-password:
    runs-on: ubuntu-latest
    needs: validate-owner-intent
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out only the audited provisioning script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: apps/backend/src/app/ops/provision_initial_owner.py
          sparse-checkout-cone-mode: false

      - name: Prepare pinned SSH trust
        env:
          HEXCORE_PROD_SSH_PRIVATE_KEY: ${{ secrets.HEXCORE_PROD_SSH_PRIVATE_KEY }}
          HEXCORE_PROD_SSH_KNOWN_HOSTS: ${{ secrets.HEXCORE_PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEXCORE_PROD_SSH_PRIVATE_KEY}"
          test -n "${HEXCORE_PROD_SSH_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/hexcore_prod_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${HEXCORE_PROD_SSH_PRIVATE_KEY}" > ~/.ssh/hexcore_prod_key
          printf '%s\n' "${HEXCORE_PROD_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null

      - name: Upload audited ephemeral provisioning script
        env:
          HEXCORE_PROD_SSH_HOST: ${{ secrets.HEXCORE_PROD_SSH_HOST }}
          HEXCORE_PROD_SSH_USER: ${{ secrets.HEXCORE_PROD_SSH_USER }}
          HEXCORE_PROD_SSH_PORT: ${{ secrets.HEXCORE_PROD_SSH_PORT || '22' }}
          FINANCE_AUDITED_SCRIPT_SHA256: 120ca4a4557f52eda2efaffcf3681f5bde6cdfc03e30abd245badb3bec2aad17
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_RUN_ID}" in
            ""|*[!0-9]*)
              echo "::error::GITHUB_RUN_ID must be numeric."
              exit 1
              ;;
          esac
          local_script="apps/backend/src/app/ops/provision_initial_owner.py"
          remote_script="/tmp/finance-provision-${GITHUB_RUN_ID}.py"
          actual_sha256="$(shasum -a 256 "${local_script}" | awk '{print $1}')"
          if [ "${actual_sha256}" != "${FINANCE_AUDITED_SCRIPT_SHA256}" ]; then
            echo "::error::Audited provisioning script checksum mismatch on runner."
            exit 1
          fi

          ssh_key="${HOME}/.ssh/hexcore_prod_key"
          known_hosts="${HOME}/.ssh/known_hosts"
          scp -P "${HEXCORE_PROD_SSH_PORT}" \
            -i "${ssh_key}" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="${known_hosts}" \
            -o StrictHostKeyChecking=yes \
            "${local_script}" \
            "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}:${remote_script}"

          remote_sha256="$(ssh -p "${HEXCORE_PROD_SSH_PORT}" \
            -i "${ssh_key}" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="${known_hosts}" \
            -o StrictHostKeyChecking=yes \
            "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}" \
            "sha256sum -- '${remote_script}'" | awk '{print $1}')"
          if [ "${remote_sha256}" != "${FINANCE_AUDITED_SCRIPT_SHA256}" ]; then
            echo "::error::Audited provisioning script checksum mismatch on production host."
            exit 1
          fi

      - name: Rotate fixed Finance account password
        env:
          HEXCORE_PROD_SSH_HOST: ${{ secrets.HEXCORE_PROD_SSH_HOST }}
          HEXCORE_PROD_SSH_USER: ${{ secrets.HEXCORE_PROD_SSH_USER }}
          HEXCORE_PROD_SSH_PORT: ${{ secrets.HEXCORE_PROD_SSH_PORT || '22' }}
          FINANCE_PROD_ROTATION_PASSWORD: ${{ secrets.FINANCE_PROD_ROTATION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${HEXCORE_PROD_SSH_HOST}"
          test -n "${HEXCORE_PROD_SSH_USER}"
          test -n "${HEXCORE_PROD_SSH_PORT}"
          test -n "${FINANCE_PROD_ROTATION_PASSWORD}"

          ssh_key="${HOME}/.ssh/hexcore_prod_key"
          known_hosts="${HOME}/.ssh/known_hosts"
          ssh_opts=(
            -p "${HEXCORE_PROD_SSH_PORT}"
            -i "${ssh_key}"
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="${known_hosts}"
            -o StrictHostKeyChecking=yes
          )

          rotation_json="$(
            printf '%s' "${FINANCE_PROD_ROTATION_PASSWORD}" \
              | base64 -w0 \
              | ssh "${ssh_opts[@]}" "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}" 'bash -c '\''
                # FINANCE_REMOTE_SCRIPT_BEGIN
                set -euo pipefail
                set +x
                remote_script="/tmp/finance-provision-${{ github.run_id }}.py"
                trap "rm -f -- \"\${remote_script}\"" EXIT
                encoded_password="$(cat)"
                password_with_sentinel="$(printf "%s" "${encoded_password}" | base64 --decode; printf "\001")"
                sentinel="$(printf "\001")"
                password="${password_with_sentinel%${sentinel}}"
                unset encoded_password password_with_sentinel sentinel
                set -a
                source /etc/finance/backend.env
                set +a
                export FINANCE_BACKEND_PROVISION_PASSWORD="${password}"
                unset password
                cd /opt/finance/current
                /opt/finance/current/venv/bin/python "${remote_script}" --email bondarenko21-aa@yandex.ru --rotate-password --require-existing-active --confirm-production
                unset FINANCE_BACKEND_PROVISION_PASSWORD
                # FINANCE_REMOTE_SCRIPT_END
              '\'''
          )"

          if ! printf '%s' "${rotation_json}" | jq -e '
            .email_normalized == "bondarenko21-aa@yandex.ru"
            and .user_created == false
            and .household_created == false
            and .membership_created == false
            and .password_rotated == true
            and (.active_sessions_revoked | type == "number")
            and .active_sessions_revoked >= 0
          ' >/dev/null; then
            echo "::error::Rotation result failed defense-in-depth validation."
            exit 1
          fi
          active_sessions_revoked="$(
            printf '%s' "${rotation_json}" | jq -er '.active_sessions_revoked'
          )"
          unset rotation_json
          echo "password_rotated=true active_sessions_revoked=${active_sessions_revoked}"

      - name: Verify production health read-only
        env:
          HEXCORE_PROD_SSH_HOST: ${{ secrets.HEXCORE_PROD_SSH_HOST }}
          HEXCORE_PROD_SSH_USER: ${{ secrets.HEXCORE_PROD_SSH_USER }}
          HEXCORE_PROD_SSH_PORT: ${{ secrets.HEXCORE_PROD_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_key="${HOME}/.ssh/hexcore_prod_key"
          known_hosts="${HOME}/.ssh/known_hosts"
          ssh_opts=(
            -p "${HEXCORE_PROD_SSH_PORT}"
            -i "${ssh_key}"
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="${known_hosts}"
            -o StrictHostKeyChecking=yes
          )
          ssh "${ssh_opts[@]}" "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}" \
            'curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8081/health >/dev/null'
          echo "production_health=ok"

      - name: Remove temporary SSH material
        if: ${{ always() }}
        env:
          HEXCORE_PROD_SSH_HOST: ${{ secrets.HEXCORE_PROD_SSH_HOST }}
          HEXCORE_PROD_SSH_USER: ${{ secrets.HEXCORE_PROD_SSH_USER }}
          HEXCORE_PROD_SSH_PORT: ${{ secrets.HEXCORE_PROD_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_script="/tmp/finance-provision-${GITHUB_RUN_ID}.py"
          if [ -s ~/.ssh/hexcore_prod_key ] && [ -s ~/.ssh/known_hosts ]; then
            ssh -p "${HEXCORE_PROD_SSH_PORT}" \
              -i ~/.ssh/hexcore_prod_key \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}" \
              "rm -f -- '${remote_script}'" || true
          fi
          rm -f ~/.ssh/hexcore_prod_key ~/.ssh/known_hosts
