name: Finance HexCore Production CI/CD

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Optional release id. Defaults to UTC timestamp plus commit SHA."
        required: false
        type: string
      deploy_frontend:
        description: "Deploy frontend artifact to /var/www/finance/releases and flip /var/www/finance/current."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deploy_backend:
        description: "Deploy backend artifact to /opt/finance/releases and flip /opt/finance/current."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_migrations:
        description: "Run Alembic upgrade from the staged backend release using /etc/finance/backend.env."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      expected_current_revision:
        description: "Required when run_migrations=true. Use an exact revision, or base for an empty DB."
        required: false
        type: string
      target_revision:
        description: "Required when run_migrations=true. Use the exact target revision, not head."
        required: false
        type: string
      backup_proof:
        description: "Required when run_migrations=true. Operator backup evidence id or ticket."
        required: false
        type: string
      restart_backend:
        description: "Restart finance-backend.service after backend symlink flip."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      confirm_production_deploy:
        description: "Required for any prod deploy or migration. Enter finance-production."
        required: false
        type: string
      confirm_backend_restart:
        description: "Required when restart_backend=true. Enter finance-backend.service."
        required: false
        type: string
  push:
    branches:
      - "prod/release-*"

permissions:
  contents: read

concurrency:
  group: finance-hexcore-prod-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FINANCE_PWA_WORKDIR: apps/web-pwa
  FINANCE_PWA_BASE_PATH: /finance/
  FINANCE_PWA_API_BASE_URL: /finance-api
  FINANCE_FRONTEND_BASE: /var/www/finance
  FINANCE_BACKEND_BASE: /opt/finance
  FINANCE_BACKEND_SERVICE: finance-backend.service
  FINANCE_BACKEND_ENV_FILE: /etc/finance/backend.env
  FINANCE_DB_BACKUP_DIR: /opt/finance/backups/postgres
  FINANCE_DB_BACKUP_MIN_FREE_KB: "1048576"
  FINANCE_BACKEND_MIN_PYTHON: "3.12"
  FINANCE_BACKEND_PYTHON_CANDIDATES: "python3.12 /opt/finance/current/venv/bin/python python3.11 python3"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Resolve release id
        id: release
        shell: bash
        env:
          FINANCE_INPUT_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          raw_release_id="${FINANCE_INPUT_RELEASE_ID}"
          if [ -n "${raw_release_id}" ]; then
            release_id="${raw_release_id}"
          else
            release_id="$(date -u +'%Y%m%dT%H%M%SZ')-${GITHUB_SHA::8}"
          fi

          if [[ ! "${release_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::release_id must be 1-128 chars and contain only letters, numbers, dot, underscore, and dash"
            exit 1
          fi

          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release id ${release_id}"

  validate-prod-inputs:
    runs-on: ubuntu-latest
    outputs:
      deploy_frontend: ${{ steps.validate.outputs.deploy_frontend }}
      deploy_backend: ${{ steps.validate.outputs.deploy_backend }}
      run_migrations: ${{ steps.validate.outputs.run_migrations }}
      expected_current_revision: ${{ steps.validate.outputs.expected_current_revision }}
      target_revision: ${{ steps.validate.outputs.target_revision }}
      restart_backend: ${{ steps.validate.outputs.restart_backend }}
      auto_db_backup: ${{ steps.validate.outputs.auto_db_backup }}
      deploy_mode: ${{ steps.validate.outputs.deploy_mode }}
      production_requested: ${{ steps.validate.outputs.production_requested }}

    steps:
      - name: Resolve production deploy plan and guardrails
        id: validate
        shell: bash
        env:
          FINANCE_INPUT_DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
          FINANCE_INPUT_DEPLOY_BACKEND: ${{ inputs.deploy_backend }}
          FINANCE_INPUT_RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          FINANCE_INPUT_RESTART_BACKEND: ${{ inputs.restart_backend }}
          FINANCE_INPUT_CONFIRM_PRODUCTION_DEPLOY: ${{ inputs.confirm_production_deploy }}
          FINANCE_INPUT_CONFIRM_BACKEND_RESTART: ${{ inputs.confirm_backend_restart }}
          FINANCE_INPUT_EXPECTED_CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          FINANCE_INPUT_TARGET_REVISION: ${{ inputs.target_revision }}
          FINANCE_INPUT_BACKUP_PROOF: ${{ inputs.backup_proof }}
        run: |
          set -euo pipefail

          event_name="${GITHUB_EVENT_NAME}"
          auto_db_backup="false"

          if [ "${event_name}" = "push" ]; then
            if [[ "${GITHUB_REF_NAME}" != prod/release-* ]]; then
              echo "::error::release push deploy requires a prod/release-* branch"
              exit 1
            fi

            deploy_frontend="true"
            deploy_backend="true"
            run_migrations="true"
            restart_backend="true"
            expected_current_revision="auto"
            target_revision="auto"
            auto_db_backup="true"
            deploy_mode="release_push"
          elif [ "${event_name}" = "workflow_dispatch" ]; then
            deploy_frontend="${FINANCE_INPUT_DEPLOY_FRONTEND}"
            deploy_backend="${FINANCE_INPUT_DEPLOY_BACKEND}"
            run_migrations="${FINANCE_INPUT_RUN_MIGRATIONS}"
            restart_backend="${FINANCE_INPUT_RESTART_BACKEND}"
            expected_current_revision="${FINANCE_INPUT_EXPECTED_CURRENT_REVISION}"
            target_revision="${FINANCE_INPUT_TARGET_REVISION}"
            deploy_mode="manual_dispatch"
          else
            echo "::error::Unsupported event ${event_name}"
            exit 1
          fi

          confirm_production_deploy="${FINANCE_INPUT_CONFIRM_PRODUCTION_DEPLOY}"
          confirm_backend_restart="${FINANCE_INPUT_CONFIRM_BACKEND_RESTART}"
          backup_proof="${FINANCE_INPUT_BACKUP_PROOF}"

          for value_name in deploy_frontend deploy_backend run_migrations restart_backend; do
            value="${!value_name}"
            if [ "${value}" != "true" ] && [ "${value}" != "false" ]; then
              echo "::error::${value_name} must be either true or false"
              exit 1
            fi
          done

          if [ -n "${confirm_production_deploy}" ] && [[ ! "${confirm_production_deploy}" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::confirm_production_deploy contains unsafe characters"
            exit 1
          fi

          if [ -n "${confirm_backend_restart}" ] && [[ ! "${confirm_backend_restart}" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::confirm_backend_restart contains unsafe characters"
            exit 1
          fi

          if [ -n "${expected_current_revision}" ] && [ "${expected_current_revision}" != "auto" ] && [[ ! "${expected_current_revision}" =~ ^(base|[A-Za-z0-9][A-Za-z0-9._-]{0,127})$ ]]; then
            echo "::error::expected_current_revision must be base or an exact safe revision token"
            exit 1
          fi

          if [ -n "${target_revision}" ] && [ "${target_revision}" != "auto" ] && [[ ! "${target_revision}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::target_revision must be an exact safe revision token"
            exit 1
          fi

          if [ -n "${backup_proof}" ] && [[ ! "${backup_proof}" =~ ^[A-Za-z0-9][A-Za-z0-9._:@/+,=-]{7,127}$ ]]; then
            echo "::error::backup_proof must be 8-128 safe chars: letters, numbers, dot, underscore, colon, at, slash, plus, comma, equals, and dash"
            exit 1
          fi

          if [ "${restart_backend}" = "true" ] && [ "${deploy_backend}" != "true" ]; then
            echo "::error::restart_backend=true requires deploy_backend=true"
            exit 1
          fi

          if [ "${run_migrations}" = "true" ] && [ "${deploy_backend}" != "true" ]; then
            echo "::error::run_migrations=true requires deploy_backend=true"
            exit 1
          fi

          if [ "${event_name}" = "workflow_dispatch" ]; then
            if [ "${deploy_frontend}" = "true" ] || [ "${deploy_backend}" = "true" ] || [ "${run_migrations}" = "true" ]; then
              if [ "${confirm_production_deploy}" != "finance-production" ]; then
                echo "::error::confirm_production_deploy must be finance-production"
                exit 1
              fi
            fi

            if [ "${restart_backend}" = "true" ] && [ "${confirm_backend_restart}" != "${FINANCE_BACKEND_SERVICE}" ]; then
              echo "::error::confirm_backend_restart must be ${FINANCE_BACKEND_SERVICE}"
              exit 1
            fi

            if [ "${run_migrations}" = "true" ]; then
              for value_name in expected_current_revision target_revision backup_proof; do
                value="${!value_name}"
                if [ -z "${value}" ]; then
                  echo "::error::${value_name} is required when run_migrations=true"
                  exit 1
                fi
              done

              expected_current_revision_lower="${expected_current_revision,,}"
              if [ "${expected_current_revision_lower}" = "head" ] || [ "${expected_current_revision_lower}" = "heads" ] || [ "${expected_current_revision_lower}" = "auto" ]; then
                echo "::error::manual expected_current_revision must be base or an exact safe revision, not head or auto"
                exit 1
              fi

              target_revision_lower="${target_revision,,}"
              if [ "${target_revision_lower}" = "head" ] || [ "${target_revision_lower}" = "heads" ] || [ "${target_revision_lower}" = "auto" ]; then
                echo "::error::manual target_revision must be an exact safe revision, not head or auto"
                exit 1
              fi

              if [ "${backup_proof}" = "none" ] || [ "${backup_proof}" = "n/a" ] || [ ${#backup_proof} -lt 8 ]; then
                echo "::error::backup_proof must identify a real backup artifact or ticket"
                exit 1
              fi
            fi
          fi

          if [ "${deploy_frontend}" = "true" ] || [ "${deploy_backend}" = "true" ] || [ "${run_migrations}" = "true" ] || [ "${restart_backend}" = "true" ]; then
            production_requested="true"
          else
            production_requested="false"
          fi

          {
            echo "deploy_frontend=${deploy_frontend}"
            echo "deploy_backend=${deploy_backend}"
            echo "run_migrations=${run_migrations}"
            echo "expected_current_revision=${expected_current_revision}"
            echo "target_revision=${target_revision}"
            echo "restart_backend=${restart_backend}"
            echo "auto_db_backup=${auto_db_backup}"
            echo "deploy_mode=${deploy_mode}"
            echo "production_requested=${production_requested}"
          } >> "${GITHUB_OUTPUT}"

  frontend-ci-package:
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-pwa/package-lock.json

      - name: Install PWA dependencies
        working-directory: ${{ env.FINANCE_PWA_WORKDIR }}
        run: npm ci

      - name: Run PWA tests
        working-directory: ${{ env.FINANCE_PWA_WORKDIR }}
        run: npm test

      - name: Build production PWA
        working-directory: ${{ env.FINANCE_PWA_WORKDIR }}
        env:
          VITE_BASE_PATH: ${{ env.FINANCE_PWA_BASE_PATH }}
          VITE_API_BASE_URL: ${{ env.FINANCE_PWA_API_BASE_URL }}
        run: npm run build

      - name: Verify production PWA output
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web-pwa/dist/index.html
          test -f apps/web-pwa/dist/manifest.webmanifest
          grep -R "/finance/" apps/web-pwa/dist/index.html apps/web-pwa/dist/manifest.webmanifest
          grep -R "/finance-api" apps/web-pwa/dist/assets

      - name: Package frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          release_id="${{ needs.prepare-release.outputs.release_id }}"
          package_dir="finance-frontend-${release_id}"
          mkdir -p "${package_dir}/dist"
          cp -a apps/web-pwa/dist/. "${package_dir}/dist/"

          {
            echo "component=frontend"
            echo "release_id=${release_id}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "source_ref=${GITHUB_REF_NAME}"
            echo "base_path=${FINANCE_PWA_BASE_PATH}"
            echo "api_base_url=${FINANCE_PWA_API_BASE_URL}"
            echo "created_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "${package_dir}/release-manifest.txt"

          find "${package_dir}/dist" -type f -print0 | sort -z | xargs -0 sha256sum > "${package_dir}/frontend.sha256"
          tar -czf "${package_dir}.tar.gz" "${package_dir}"
          sha256sum "${package_dir}.tar.gz" > "${package_dir}.tar.gz.sha256"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-frontend-${{ needs.prepare-release.outputs.release_id }}
          path: |
            finance-frontend-${{ needs.prepare-release.outputs.release_id }}.tar.gz
            finance-frontend-${{ needs.prepare-release.outputs.release_id }}.tar.gz.sha256
          retention-days: 14

  backend-ci-package:
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dev dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e "apps/backend[dev]"

      - name: Run backend lint
        working-directory: apps/backend
        run: python -m ruff check src tests ../../db/migrations

      - name: Run backend tests
        working-directory: apps/backend
        run: python -m pytest

      - name: Build backend wheel
        working-directory: apps/backend
        run: python -m build --wheel

      - name: Package backend artifact
        shell: bash
        run: |
          set -euo pipefail
          release_id="${{ needs.prepare-release.outputs.release_id }}"
          package_dir="finance-backend-${release_id}"
          mkdir -p "${package_dir}/apps/backend" "${package_dir}/db"
          cp -a apps/backend/dist "${package_dir}/apps/backend/dist"
          cp -a apps/backend/src "${package_dir}/apps/backend/src"
          cp apps/backend/pyproject.toml apps/backend/alembic.ini apps/backend/README.md "${package_dir}/apps/backend/"
          cp -a db/migrations "${package_dir}/db/migrations"

          {
            echo "component=backend"
            echo "release_id=${release_id}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "source_ref=${GITHUB_REF_NAME}"
            echo "service=${FINANCE_BACKEND_SERVICE}"
            echo "host_env_file=${FINANCE_BACKEND_ENV_FILE}"
            echo "created_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "${package_dir}/release-manifest.txt"

          find "${package_dir}" -type f ! -name "backend.sha256" -print0 | sort -z | xargs -0 sha256sum > "${package_dir}/backend.sha256"
          tar -czf "${package_dir}.tar.gz" "${package_dir}"
          sha256sum "${package_dir}.tar.gz" > "${package_dir}.tar.gz.sha256"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-backend-${{ needs.prepare-release.outputs.release_id }}
          path: |
            finance-backend-${{ needs.prepare-release.outputs.release_id }}.tar.gz
            finance-backend-${{ needs.prepare-release.outputs.release_id }}.tar.gz.sha256
          retention-days: 14

  production-package-gate:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - validate-prod-inputs
      - frontend-ci-package
      - backend-ci-package

    steps:
      - name: Require both production packages
        env:
          FINANCE_VALIDATE_RESULT: ${{ needs.validate-prod-inputs.result }}
          FINANCE_FRONTEND_PACKAGE_RESULT: ${{ needs.frontend-ci-package.result }}
          FINANCE_BACKEND_PACKAGE_RESULT: ${{ needs.backend-ci-package.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result_name in FINANCE_VALIDATE_RESULT FINANCE_FRONTEND_PACKAGE_RESULT FINANCE_BACKEND_PACKAGE_RESULT; do
            result="${!result_name}"
            if [ "${result}" != "success" ]; then
              echo "::error::${result_name}=${result}; production package gate requires success"
              exit 1
            fi
          done
          echo "Both production package lanes and input validation succeeded."

  host-preflight:
    if: ${{ needs.validate-prod-inputs.outputs.production_requested == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - validate-prod-inputs
      - frontend-ci-package
      - backend-ci-package
      - production-package-gate
    environment: production
    outputs:
      backend_current_release_id: ${{ steps.remote.outputs.backend_current_release_id }}
      frontend_current_release_id: ${{ steps.remote.outputs.frontend_current_release_id }}
      alembic_current: ${{ steps.remote.outputs.alembic_current }}
      alembic_target: ${{ steps.lineage.outputs.alembic_target }}

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Setup Python for migration graph validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Alembic graph tooling
        run: python -m pip install "alembic>=1.13,<2.0"

      - name: Prepare pinned SSH trust
        env:
          HEXCORE_PROD_SSH_PRIVATE_KEY: ${{ secrets.HEXCORE_PROD_SSH_PRIVATE_KEY }}
          HEXCORE_PROD_SSH_KNOWN_HOSTS: ${{ secrets.HEXCORE_PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEXCORE_PROD_SSH_PRIVATE_KEY}"
          test -n "${HEXCORE_PROD_SSH_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/hexcore_prod_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${HEXCORE_PROD_SSH_PRIVATE_KEY}" > ~/.ssh/hexcore_prod_key
          printf '%s\n' "${HEXCORE_PROD_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null

      - name: Run read-only production host preflight
        id: remote
        env:
          HEXCORE_PROD_SSH_HOST: ${{ secrets.HEXCORE_PROD_SSH_HOST }}
          HEXCORE_PROD_SSH_USER: ${{ secrets.HEXCORE_PROD_SSH_USER }}
          HEXCORE_PROD_SSH_PORT: ${{ secrets.HEXCORE_PROD_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEXCORE_PROD_SSH_HOST}"
          test -n "${HEXCORE_PROD_SSH_USER}"
          test -n "${HEXCORE_PROD_SSH_PORT}"

          ssh_key="${HOME}/.ssh/hexcore_prod_key"
          known_hosts="${HOME}/.ssh/known_hosts"
          ssh_opts=(
            -p "${HEXCORE_PROD_SSH_PORT}"
            -i "${ssh_key}"
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="${known_hosts}"
            -o StrictHostKeyChecking=yes
          )

          ssh "${ssh_opts[@]}" "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}" \
            "FINANCE_FRONTEND_BASE='${FINANCE_FRONTEND_BASE}' FINANCE_BACKEND_BASE='${FINANCE_BACKEND_BASE}' FINANCE_BACKEND_ENV_FILE='${FINANCE_BACKEND_ENV_FILE}' FINANCE_BACKEND_SERVICE='${FINANCE_BACKEND_SERVICE}' FINANCE_DB_BACKUP_DIR='${FINANCE_DB_BACKUP_DIR}' FINANCE_DB_BACKUP_MIN_FREE_KB='${FINANCE_DB_BACKUP_MIN_FREE_KB}' bash -s" > host-preflight.env <<'REMOTE'
          set -euo pipefail

          frontend_current="${FINANCE_FRONTEND_BASE}/current"
          backend_current="${FINANCE_BACKEND_BASE}/current"
          test -L "${frontend_current}" || {
            echo "Frontend current is not a symlink" >&2
            exit 1
          }
          test -L "${backend_current}" || {
            echo "Backend current is not a symlink" >&2
            exit 1
          }

          frontend_release_dir="$(readlink -f "${frontend_current}")"
          backend_release_dir="$(readlink -f "${backend_current}")"
          case "${frontend_release_dir}" in
            "${FINANCE_FRONTEND_BASE}"/releases/*) ;;
            *) echo "Frontend current does not resolve under releases" >&2; exit 1 ;;
          esac
          case "${backend_release_dir}" in
            "${FINANCE_BACKEND_BASE}"/releases/*) ;;
            *) echo "Backend current does not resolve under releases" >&2; exit 1 ;;
          esac

          frontend_release_id="$(basename "${frontend_release_dir}")"
          backend_release_id="$(basename "${backend_release_dir}")"
          case "${frontend_release_id}${backend_release_id}" in
            *[!A-Za-z0-9._-]*) echo "Current release id contains unsafe characters" >&2; exit 1 ;;
          esac

          systemctl is-active --quiet "${FINANCE_BACKEND_SERVICE}" || {
            echo "Backend service is not active" >&2
            exit 1
          }
          service_exec_start="$(systemctl show "${FINANCE_BACKEND_SERVICE}" -p ExecStart --value --no-pager)"
          service_working_directory="$(systemctl show "${FINANCE_BACKEND_SERVICE}" -p WorkingDirectory --value --no-pager)"
          service_main_pid="$(systemctl show "${FINANCE_BACKEND_SERVICE}" -p MainPID --value --no-pager)"
          [[ "${service_main_pid}" =~ ^[1-9][0-9]*$ ]] || {
            echo "Backend service has no live MainPID" >&2
            exit 1
          }
          test -r "/proc/${service_main_pid}/cmdline"
          process_command="$(tr '\0' ' ' < "/proc/${service_main_pid}/cmdline")"
          service_wiring="${service_exec_start} ${service_working_directory} ${process_command}"
          if [[ "${service_wiring}" != *"${FINANCE_BACKEND_BASE}/current"* ]]; then
            echo "Backend service wiring does not consume /opt/finance/current" >&2
            exit 1
          fi

          command -v pg_dump >/dev/null || {
            echo "pg_dump is unavailable" >&2
            exit 1
          }
          test -d "${FINANCE_DB_BACKUP_DIR}" || {
            echo "Backup directory does not exist" >&2
            exit 1
          }
          test -w "${FINANCE_DB_BACKUP_DIR}" -a -x "${FINANCE_DB_BACKUP_DIR}" || {
            echo "Backup directory is not writable" >&2
            exit 1
          }
          backup_free_kb="$(df -Pk -- "${FINANCE_DB_BACKUP_DIR}" | awk 'END {print $4}')"
          [[ "${backup_free_kb}" =~ ^[0-9]+$ ]]
          [[ "${FINANCE_DB_BACKUP_MIN_FREE_KB}" =~ ^[0-9]+$ ]]
          if [ "${backup_free_kb}" -lt "${FINANCE_DB_BACKUP_MIN_FREE_KB}" ]; then
            echo "Backup filesystem has insufficient free space" >&2
            exit 1
          fi

          test -d "${backend_release_dir}/package/apps/backend"
          test -x "${backend_release_dir}/venv/bin/python"
          test -f "${FINANCE_BACKEND_ENV_FILE}"
          set -a
          . "${FINANCE_BACKEND_ENV_FILE}"
          set +a
          cd "${backend_release_dir}/package/apps/backend"
          alembic_output="$("${backend_release_dir}/venv/bin/python" -m alembic -c alembic.ini current)"
          mapfile -t revisions < <(printf '%s\n' "${alembic_output}" | awk 'NF {print $1}')
          if [ "${#revisions[@]}" -eq 0 ]; then
            alembic_current="base"
          elif [ "${#revisions[@]}" -eq 1 ] && [[ "${revisions[0]}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            alembic_current="${revisions[0]}"
          else
            echo "Alembic current did not return exactly one safe revision" >&2
            exit 1
          fi

          printf 'frontend_current_release_id=%s\n' "${frontend_release_id}"
          printf 'backend_current_release_id=%s\n' "${backend_release_id}"
          printf 'service_active=true\n'
          printf 'service_uses_current=true\n'
          printf 'pg_dump_available=true\n'
          printf 'backup_dir_writable=true\n'
          printf 'backup_free_kb=%s\n' "${backup_free_kb}"
          printf 'alembic_current=%s\n' "${alembic_current}"
          REMOTE

          declare -A observed=()
          while IFS='=' read -r key value; do
            case "${key}" in
              frontend_current_release_id|backend_current_release_id|alembic_current)
                [[ "${value}" =~ ^(base|[A-Za-z0-9][A-Za-z0-9._-]{0,127})$ ]]
                ;;
              service_active|service_uses_current|pg_dump_available|backup_dir_writable)
                [ "${value}" = "true" ]
                ;;
              backup_free_kb)
                [[ "${value}" =~ ^[0-9]+$ ]]
                ;;
              *)
                echo "::error::Unexpected host preflight evidence key"
                exit 1
                ;;
            esac
            observed["${key}"]="${value}"
          done < host-preflight.env

          for key in frontend_current_release_id backend_current_release_id service_active service_uses_current pg_dump_available backup_dir_writable backup_free_kb alembic_current; do
            if [ -z "${observed[${key}]:-}" ]; then
              echo "::error::Missing host preflight evidence: ${key}"
              exit 1
            fi
          done

          {
            echo "frontend_current_release_id=${observed[frontend_current_release_id]}"
            echo "backend_current_release_id=${observed[backend_current_release_id]}"
            echo "alembic_current=${observed[alembic_current]}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate live Alembic revision against release graph
        id: lineage
        env:
          FINANCE_LIVE_REVISION: ${{ steps.remote.outputs.alembic_current }}
          FINANCE_EXPECTED_CURRENT_REVISION: ${{ needs.validate-prod-inputs.outputs.expected_current_revision }}
          FINANCE_REQUESTED_TARGET_REVISION: ${{ needs.validate-prod-inputs.outputs.target_revision }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          from alembic.config import Config
          from alembic.script import ScriptDirectory

          live = os.environ["FINANCE_LIVE_REVISION"]
          expected = os.environ.get("FINANCE_EXPECTED_CURRENT_REVISION", "")
          requested_target = os.environ.get("FINANCE_REQUESTED_TARGET_REVISION", "")

          config = Config("apps/backend/alembic.ini")
          config.set_main_option("script_location", str(Path("db/migrations").resolve()))
          script = ScriptDirectory.from_config(config)
          heads = script.get_heads()
          if len(heads) != 1:
              raise SystemExit(f"Expected one Alembic head, got {len(heads)}")

          target = heads[0] if requested_target in {"", "auto"} else requested_target
          if expected not in {"", "auto"} and live != expected:
              raise SystemExit("Live Alembic revision does not match expected_current_revision")

          script.get_revision(target)
          if live != "base":
              script.get_revision(live)
              list(script.iterate_revisions(target, live))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"alembic_target={target}\n")
          PY

      - name: Write sanitized host preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "source_ref=${GITHUB_REF_NAME}"
            echo "release_id=${{ needs.prepare-release.outputs.release_id }}"
            cat host-preflight.env
            echo "alembic_target=${{ steps.lineage.outputs.alembic_target }}"
          } > host-preflight-sanitized.txt
          cat host-preflight-sanitized.txt >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized host preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: finance-host-preflight-${{ needs.prepare-release.outputs.release_id }}
          path: host-preflight-sanitized.txt
          retention-days: 14

  deploy-frontend:
    if: >-
      ${{ always() &&
          needs.validate-prod-inputs.outputs.deploy_frontend == 'true' &&
          needs.production-package-gate.result == 'success' &&
          needs.host-preflight.result == 'success' &&
          (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - validate-prod-inputs
      - frontend-ci-package
      - backend-ci-package
      - production-package-gate
      - host-preflight
      - deploy-backend
    environment: production

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: finance-frontend-${{ needs.prepare-release.outputs.release_id }}

      - name: Prepare pinned SSH trust
        env:
          HEXCORE_PROD_SSH_PRIVATE_KEY: ${{ secrets.HEXCORE_PROD_SSH_PRIVATE_KEY }}
          HEXCORE_PROD_SSH_KNOWN_HOSTS: ${{ secrets.HEXCORE_PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEXCORE_PROD_SSH_PRIVATE_KEY}"
          test -n "${HEXCORE_PROD_SSH_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/hexcore_prod_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${HEXCORE_PROD_SSH_PRIVATE_KEY}" > ~/.ssh/hexcore_prod_key
          printf '%s\n' "${HEXCORE_PROD_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null

      - name: Deploy frontend artifact to HexCore
        env:
          HEXCORE_PROD_SSH_HOST: ${{ secrets.HEXCORE_PROD_SSH_HOST }}
          HEXCORE_PROD_SSH_USER: ${{ secrets.HEXCORE_PROD_SSH_USER }}
          HEXCORE_PROD_SSH_PORT: ${{ secrets.HEXCORE_PROD_SSH_PORT || '22' }}
          FINANCE_RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEXCORE_PROD_SSH_HOST}"
          test -n "${HEXCORE_PROD_SSH_USER}"
          test -n "${HEXCORE_PROD_SSH_PORT}"

          ssh_key="${HOME}/.ssh/hexcore_prod_key"
          known_hosts="${HOME}/.ssh/known_hosts"
          artifact="finance-frontend-${FINANCE_RELEASE_ID}.tar.gz"
          remote_tmp="/tmp/${artifact}"
          ssh_opts=(
            -p "${HEXCORE_PROD_SSH_PORT}"
            -i "${ssh_key}"
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="${known_hosts}"
            -o StrictHostKeyChecking=yes
          )

          sha256sum -c "${artifact}.sha256"
          scp -P "${HEXCORE_PROD_SSH_PORT}" \
            -i "${ssh_key}" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="${known_hosts}" \
            -o StrictHostKeyChecking=yes \
            "${artifact}" \
            "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}:${remote_tmp}"

          ssh "${ssh_opts[@]}" "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}" \
            "FINANCE_RELEASE_ID='${FINANCE_RELEASE_ID}' FINANCE_REMOTE_TMP='${remote_tmp}' FINANCE_FRONTEND_BASE='${FINANCE_FRONTEND_BASE}' bash -s" <<'REMOTE'
          set -euo pipefail
          case "${FINANCE_RELEASE_ID}" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe FINANCE_RELEASE_ID"
              exit 1
              ;;
          esac

          base="${FINANCE_FRONTEND_BASE}"
          releases="${base}/releases"
          current="${base}/current"
          release_dir="${releases}/${FINANCE_RELEASE_ID}"
          tmp_extract="$(mktemp -d /tmp/finance-frontend.XXXXXX)"
          cleanup() {
            rm -rf "${tmp_extract}" "${FINANCE_REMOTE_TMP}"
          }
          trap cleanup EXIT

          mkdir -p "${releases}"
          tar -xzf "${FINANCE_REMOTE_TMP}" -C "${tmp_extract}"
          artifact_root="${tmp_extract}/finance-frontend-${FINANCE_RELEASE_ID}"
          test -f "${artifact_root}/dist/index.html"
          test -f "${artifact_root}/dist/manifest.webmanifest"

          if [ -e "${current}" ] && [ ! -L "${current}" ]; then
            echo "${current} exists and is not a symlink; perform one-time cutover before CI/CD deploy"
            exit 1
          fi

          if [ -e "${release_dir}" ]; then
            echo "${release_dir} already exists"
            exit 1
          fi

          mkdir -p "${release_dir}"
          cp -a "${artifact_root}/dist/." "${release_dir}/"
          cp "${artifact_root}/frontend.sha256" "${release_dir}/.frontend.sha256"
          cp "${artifact_root}/release-manifest.txt" "${release_dir}/.release-manifest.txt"

          ln -sfnT "${release_dir}" "${current}.next"
          mv -Tf "${current}.next" "${current}"
          test "$(readlink -f "${current}")" = "${release_dir}"

          routes_ready="false"
          for attempt in {1..24}; do
            if curl -fsS --max-time 10 http://127.0.0.1/finance/ >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1/finance-api/health >/dev/null; then
              routes_ready="true"
              break
            fi

            echo "Waiting for Finance routes after frontend deploy, attempt ${attempt}/24..."
            sleep 5
          done

          if [ "${routes_ready}" != "true" ]; then
            echo "::error::Finance routes did not become healthy after frontend deploy"
            exit 1
          fi
          REMOTE

  deploy-backend:
    if: >-
      ${{ needs.validate-prod-inputs.outputs.deploy_backend == 'true' &&
          needs.production-package-gate.result == 'success' &&
          needs.host-preflight.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - validate-prod-inputs
      - frontend-ci-package
      - backend-ci-package
      - production-package-gate
      - host-preflight
    environment: production

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: finance-backend-${{ needs.prepare-release.outputs.release_id }}

      - name: Prepare pinned SSH trust
        env:
          HEXCORE_PROD_SSH_PRIVATE_KEY: ${{ secrets.HEXCORE_PROD_SSH_PRIVATE_KEY }}
          HEXCORE_PROD_SSH_KNOWN_HOSTS: ${{ secrets.HEXCORE_PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEXCORE_PROD_SSH_PRIVATE_KEY}"
          test -n "${HEXCORE_PROD_SSH_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/hexcore_prod_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${HEXCORE_PROD_SSH_PRIVATE_KEY}" > ~/.ssh/hexcore_prod_key
          printf '%s\n' "${HEXCORE_PROD_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null

      - name: Inspect HexCore backend Python runtime
        env:
          HEXCORE_PROD_SSH_HOST: ${{ secrets.HEXCORE_PROD_SSH_HOST }}
          HEXCORE_PROD_SSH_USER: ${{ secrets.HEXCORE_PROD_SSH_USER }}
          HEXCORE_PROD_SSH_PORT: ${{ secrets.HEXCORE_PROD_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEXCORE_PROD_SSH_HOST}"
          test -n "${HEXCORE_PROD_SSH_USER}"
          test -n "${HEXCORE_PROD_SSH_PORT}"

          ssh_key="${HOME}/.ssh/hexcore_prod_key"
          known_hosts="${HOME}/.ssh/known_hosts"
          ssh_opts=(
            -p "${HEXCORE_PROD_SSH_PORT}"
            -i "${ssh_key}"
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="${known_hosts}"
            -o StrictHostKeyChecking=yes
          )

          ssh "${ssh_opts[@]}" "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}" bash -s <<'REMOTE'
          set -euo pipefail

          inspect_python() {
            local candidate="$1"
            local resolved
            local version
            resolved="$(command -v "${candidate}" 2>/dev/null || true)"
            if [ -z "${resolved}" ]; then
              echo "${candidate}=missing"
              return 0
            fi

            version="$("${resolved}" --version 2>&1 || true)"
            echo "${candidate}=present ${version}"
          }

          inspect_python python3.12
          inspect_python python3.11
          inspect_python python3

          if [ -x /opt/finance/current/venv/bin/python ]; then
            version="$(/opt/finance/current/venv/bin/python --version 2>&1 || true)"
            echo "current_venv_python=present ${version}"
          else
            echo "current_venv_python=missing_or_not_executable"
          fi
          REMOTE

      - name: Deploy backend artifact to HexCore
        env:
          HEXCORE_PROD_SSH_HOST: ${{ secrets.HEXCORE_PROD_SSH_HOST }}
          HEXCORE_PROD_SSH_USER: ${{ secrets.HEXCORE_PROD_SSH_USER }}
          HEXCORE_PROD_SSH_PORT: ${{ secrets.HEXCORE_PROD_SSH_PORT || '22' }}
          FINANCE_RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          FINANCE_RUN_MIGRATIONS: ${{ needs.validate-prod-inputs.outputs.run_migrations }}
          FINANCE_EXPECTED_CURRENT_REVISION: ${{ needs.validate-prod-inputs.outputs.expected_current_revision }}
          FINANCE_TARGET_REVISION: ${{ needs.validate-prod-inputs.outputs.target_revision }}
          FINANCE_RESTART_BACKEND: ${{ needs.validate-prod-inputs.outputs.restart_backend }}
          FINANCE_AUTO_DB_BACKUP: ${{ needs.validate-prod-inputs.outputs.auto_db_backup }}
          FINANCE_DEPLOY_MODE: ${{ needs.validate-prod-inputs.outputs.deploy_mode }}
          FINANCE_DB_BACKUP_DIR: ${{ env.FINANCE_DB_BACKUP_DIR }}
          FINANCE_BACKEND_MIN_PYTHON: ${{ env.FINANCE_BACKEND_MIN_PYTHON }}
          FINANCE_BACKEND_PYTHON_CANDIDATES: ${{ env.FINANCE_BACKEND_PYTHON_CANDIDATES }}
          FINANCE_COMMIT_SHA: ${{ github.sha }}
          FINANCE_GITHUB_RUN_ID: ${{ github.run_id }}
          FINANCE_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HEXCORE_PROD_SSH_HOST}"
          test -n "${HEXCORE_PROD_SSH_USER}"
          test -n "${HEXCORE_PROD_SSH_PORT}"

          ssh_key="${HOME}/.ssh/hexcore_prod_key"
          known_hosts="${HOME}/.ssh/known_hosts"
          artifact="finance-backend-${FINANCE_RELEASE_ID}.tar.gz"
          remote_tmp="/tmp/${artifact}"
          ssh_opts=(
            -p "${HEXCORE_PROD_SSH_PORT}"
            -i "${ssh_key}"
            -o IdentitiesOnly=yes
            -o UserKnownHostsFile="${known_hosts}"
            -o StrictHostKeyChecking=yes
          )

          sha256sum -c "${artifact}.sha256"
          scp -P "${HEXCORE_PROD_SSH_PORT}" \
            -i "${ssh_key}" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="${known_hosts}" \
            -o StrictHostKeyChecking=yes \
            "${artifact}" \
            "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}:${remote_tmp}"

          ssh "${ssh_opts[@]}" "${HEXCORE_PROD_SSH_USER}@${HEXCORE_PROD_SSH_HOST}" \
            "FINANCE_RELEASE_ID='${FINANCE_RELEASE_ID}' FINANCE_REMOTE_TMP='${remote_tmp}' FINANCE_BACKEND_BASE='${FINANCE_BACKEND_BASE}' FINANCE_BACKEND_ENV_FILE='${FINANCE_BACKEND_ENV_FILE}' FINANCE_BACKEND_SERVICE='${FINANCE_BACKEND_SERVICE}' FINANCE_RUN_MIGRATIONS='${FINANCE_RUN_MIGRATIONS}' FINANCE_EXPECTED_CURRENT_REVISION='${FINANCE_EXPECTED_CURRENT_REVISION}' FINANCE_TARGET_REVISION='${FINANCE_TARGET_REVISION}' FINANCE_RESTART_BACKEND='${FINANCE_RESTART_BACKEND}' FINANCE_AUTO_DB_BACKUP='${FINANCE_AUTO_DB_BACKUP}' FINANCE_DEPLOY_MODE='${FINANCE_DEPLOY_MODE}' FINANCE_DB_BACKUP_DIR='${FINANCE_DB_BACKUP_DIR}' FINANCE_BACKEND_MIN_PYTHON='${FINANCE_BACKEND_MIN_PYTHON}' FINANCE_BACKEND_PYTHON_CANDIDATES='${FINANCE_BACKEND_PYTHON_CANDIDATES}' FINANCE_COMMIT_SHA='${FINANCE_COMMIT_SHA}' FINANCE_GITHUB_RUN_ID='${FINANCE_GITHUB_RUN_ID}' FINANCE_GITHUB_RUN_ATTEMPT='${FINANCE_GITHUB_RUN_ATTEMPT}' bash -s" <<'REMOTE'
          set -euo pipefail
          case "${FINANCE_RELEASE_ID}" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Unsafe FINANCE_RELEASE_ID"
              exit 1
              ;;
          esac

          base="${FINANCE_BACKEND_BASE}"
          releases="${base}/releases"
          current="${base}/current"
          release_dir="${releases}/${FINANCE_RELEASE_ID}"
          tmp_extract="$(mktemp -d /tmp/finance-backend.XXXXXX)"
          cleanup() {
            rm -rf "${tmp_extract}" "${FINANCE_REMOTE_TMP}"
          }
          trap cleanup EXIT

          mkdir -p "${releases}"
          tar -xzf "${FINANCE_REMOTE_TMP}" -C "${tmp_extract}"
          artifact_root="${tmp_extract}/finance-backend-${FINANCE_RELEASE_ID}"
          test -d "${artifact_root}/apps/backend/dist"
          test -d "${artifact_root}/db/migrations"

          if [ -e "${current}" ] && [ ! -L "${current}" ]; then
            echo "${current} exists and is not a symlink; perform one-time cutover before CI/CD deploy"
            exit 1
          fi

          if [ -e "${release_dir}" ]; then
            echo "${release_dir} already exists"
            exit 1
          fi

          mkdir -p "${release_dir}/package"
          cp -a "${artifact_root}/." "${release_dir}/package/"
          cp "${artifact_root}/backend.sha256" "${release_dir}/.backend.sha256"
          cp "${artifact_root}/release-manifest.txt" "${release_dir}/.release-manifest.txt"

          python_candidate_available() {
            local candidate="$1"
            case "${candidate}" in
              */*) [ -x "${candidate}" ] ;;
              *) command -v "${candidate}" >/dev/null 2>&1 ;;
            esac
          }

          validate_python_candidate() {
            local candidate="$1"
            "${candidate}" - "${FINANCE_BACKEND_MIN_PYTHON}" <<'PY'
          import sys

          minimum = tuple(int(part) for part in sys.argv[1].split("."))
          current = sys.version_info[: len(minimum)]
          raise SystemExit(0 if current >= minimum else 1)
          PY
          }

          python_version() {
            local candidate="$1"
            "${candidate}" - <<'PY'
          import sys

          print(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")
          PY
          }

          create_backend_venv() {
            local venv_dir="$1"
            local candidate
            local version

            for candidate in ${FINANCE_BACKEND_PYTHON_CANDIDATES}; do
              case "${candidate}" in
                ""|*[!A-Za-z0-9_./-]*)
                  echo "::error::Unsafe backend Python candidate configured"
                  return 1
                  ;;
              esac

              if ! python_candidate_available "${candidate}"; then
                echo "Backend Python candidate unavailable: ${candidate}"
                continue
              fi

              version="$(python_version "${candidate}" 2>/dev/null || true)"
              if [ -z "${version}" ]; then
                echo "Backend Python candidate could not report a version: ${candidate}"
                continue
              fi

              if ! validate_python_candidate "${candidate}"; then
                echo "Backend Python candidate ${candidate} has version ${version}; requires >=${FINANCE_BACKEND_MIN_PYTHON}"
                continue
              fi

              rm -rf "${venv_dir}"
              if "${candidate}" -m venv "${venv_dir}"; then
                created_version="$(python_version "${venv_dir}/bin/python")"
                if validate_python_candidate "${venv_dir}/bin/python"; then
                  echo "Created backend virtual environment with Python ${created_version} from ${candidate}"
                  return 0
                fi

                echo "Backend virtual environment Python ${created_version} does not satisfy >=${FINANCE_BACKEND_MIN_PYTHON}"
              else
                echo "Backend Python candidate ${candidate} could not create a virtual environment"
              fi
            done

            echo "::error::No Python >=${FINANCE_BACKEND_MIN_PYTHON} interpreter capable of creating the backend virtual environment was found on HexCore"
            return 1
          }

          create_backend_venv "${release_dir}/venv"
          "${release_dir}/venv/bin/python" -m pip install --upgrade pip
          "${release_dir}/venv/bin/python" -m pip install "${release_dir}"/package/apps/backend/dist/*.whl
          install -d -m 755 "${release_dir}/bin"
          cat > "${release_dir}/bin/finance-backend" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          script_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          release_dir="$(cd "${script_dir}/.." && pwd)"
          cd "${release_dir}/package/apps/backend"
          exec "${release_dir}/venv/bin/uvicorn" app.main:app \
            --host "${FINANCE_BACKEND_HOST:-127.0.0.1}" \
            --port "${FINANCE_BACKEND_PORT:-8081}"
          SH
          chmod 755 "${release_dir}/bin/finance-backend"

          if [ "${FINANCE_RUN_MIGRATIONS}" = "true" ]; then
            test -f "${FINANCE_BACKEND_ENV_FILE}"
            set -a
            . "${FINANCE_BACKEND_ENV_FILE}"
            set +a

            cd "${release_dir}/package/apps/backend"
            alembic_python="${release_dir}/venv/bin/python"

            safe_revision_token() {
              local revision="$1"
              if [ "${revision}" = "base" ]; then
                return 0
              fi
              [[ "${revision}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
            }

            read_single_alembic_revision() {
              local alembic_command="$1"
              local -a revisions=()
              mapfile -t revisions < <("${alembic_python}" -m alembic -c alembic.ini "${alembic_command}" | awk '/^[A-Za-z0-9][A-Za-z0-9._-]*/ {print $1}')

              if [ "${#revisions[@]}" -eq 0 ] && [ "${alembic_command}" = "current" ]; then
                echo "base"
                return 0
              fi

              if [ "${#revisions[@]}" -ne 1 ]; then
                echo "::error::Alembic ${alembic_command} returned ${#revisions[@]} revisions; expected exactly one"
                return 1
              fi

              if ! safe_revision_token "${revisions[0]}"; then
                echo "::error::Alembic ${alembic_command} returned an unsafe revision token"
                return 1
              fi

              echo "${revisions[0]}"
            }

            create_finance_db_backup() {
              local before_revision="$1"
              local target_revision="$2"

              command -v pg_dump >/dev/null || {
                echo "::error::pg_dump is required on HexCore before running release-push migrations"
                return 1
              }

              local db_url="${FINANCE_BACKEND_DATABASE_URL:-${DATABASE_URL:-}}"
              if [ -z "${db_url}" ]; then
                echo "::error::FINANCE_BACKEND_DATABASE_URL or DATABASE_URL must be present in ${FINANCE_BACKEND_ENV_FILE}"
                return 1
              fi

              if [[ ! "${FINANCE_DB_BACKUP_DIR}" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
                echo "::error::FINANCE_DB_BACKUP_DIR must be an absolute safe path"
                return 1
              fi

              local pg_env
              local pgpass_file
              pg_env="$(mktemp)"
              pgpass_file="$(mktemp)"
              chmod 600 "${pgpass_file}"

              if ! FINANCE_DB_URL_FOR_BACKUP="${db_url}" "${alembic_python}" - "${pgpass_file}" > "${pg_env}" <<'PY'
          import os
          import shlex
          import sys
          from pathlib import Path
          from urllib.parse import parse_qs, unquote, urlsplit

          db_url = os.environ["FINANCE_DB_URL_FOR_BACKUP"]
          pgpass_path = Path(sys.argv[1])
          parsed = urlsplit(db_url)
          scheme = parsed.scheme.split("+", 1)[0]
          if scheme not in {"postgres", "postgresql"}:
              raise SystemExit("Database URL must use a PostgreSQL scheme")

          query = parse_qs(parsed.query)
          host = unquote(parsed.hostname or (query.get("host", ["localhost"])[0] or "localhost"))
          port = parsed.port or int(query.get("port", ["5432"])[0])
          user = unquote(parsed.username or "")
          password = unquote(parsed.password or "")
          database = unquote(parsed.path.lstrip("/").split("?", 1)[0])
          if not user:
              raise SystemExit("Database URL must include a username for non-interactive backup")
          if not database:
              raise SystemExit("Database URL must include a database name")

          def pgpass_escape(value: str) -> str:
              return value.replace("\\", "\\\\").replace(":", "\\:")

          pgpass_path.write_text(
              f"{pgpass_escape(host)}:{port}:{pgpass_escape(database)}:{pgpass_escape(user)}:{pgpass_escape(password)}\n",
              encoding="utf-8",
          )
          pgpass_path.chmod(0o600)

          def emit(name: str, value: str) -> None:
              print(f"{name}={shlex.quote(value)}")

          emit("PGHOST", host)
          emit("PGPORT", str(port))
          emit("PGUSER", user)
          emit("PGDATABASE", database)
          emit("PGPASSFILE", str(pgpass_path))
          if "sslmode" in query:
              emit("PGSSLMODE", query["sslmode"][0])
          PY
              then
                rm -f "${pg_env}" "${pgpass_file}"
                echo "::error::Unable to parse production database URL for backup"
                return 1
              fi

              . "${pg_env}"
              rm -f "${pg_env}"
              export PGHOST PGPORT PGUSER PGDATABASE PGPASSFILE
              if [ -n "${PGSSLMODE:-}" ]; then
                export PGSSLMODE
              fi

              install -d -m 700 "${FINANCE_DB_BACKUP_DIR}"
              local stamp
              local safe_database
              local backup_file
              local evidence_file
              stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
              safe_database="$(printf '%s' "${PGDATABASE}" | tr -c 'A-Za-z0-9._-' '_')"
              backup_file="${FINANCE_DB_BACKUP_DIR}/${safe_database}-${stamp}-${FINANCE_RELEASE_ID}-${before_revision}-to-${target_revision}.dump"
              evidence_file="${backup_file}.evidence.txt"

              if ! pg_dump --format=custom --no-owner --no-privileges --file "${backup_file}" "${PGDATABASE}"; then
                rm -f "${PGPASSFILE}" "${backup_file}"
                echo "::error::Production database backup failed before migration"
                return 1
              fi
              rm -f "${PGPASSFILE}"

              sha256sum "${backup_file}" > "${backup_file}.sha256"
              backup_sha="$(awk '{print $1}' "${backup_file}.sha256")"
              {
                echo "release_id=${FINANCE_RELEASE_ID}"
                echo "deploy_mode=${FINANCE_DEPLOY_MODE}"
                echo "commit_sha=${FINANCE_COMMIT_SHA}"
                echo "github_run_id=${FINANCE_GITHUB_RUN_ID}"
                echo "github_run_attempt=${FINANCE_GITHUB_RUN_ATTEMPT}"
                echo "database=${PGDATABASE}"
                echo "created_utc=${stamp}"
                echo "alembic_current_before=${before_revision}"
                echo "alembic_target=${target_revision}"
                echo "backup_file=${backup_file}"
                echo "backup_sha256=${backup_sha}"
              } > "${evidence_file}"
              chmod 600 "${backup_file}" "${backup_file}.sha256" "${evidence_file}"

              echo "Created Finance production DB backup evidence:"
              echo "  backup_file=${backup_file}"
              echo "  backup_sha256=${backup_sha}"
              echo "  evidence_file=${evidence_file}"
            }

            current_revision="$(read_single_alembic_revision current)"
            target_revision="${FINANCE_TARGET_REVISION}"
            if [ "${target_revision}" = "auto" ]; then
              target_revision="$(read_single_alembic_revision heads)"
            fi

            if ! safe_revision_token "${target_revision}"; then
              echo "::error::Alembic target revision is unsafe"
              exit 1
            fi

            expected_current_revision="${FINANCE_EXPECTED_CURRENT_REVISION}"
            if [ "${expected_current_revision}" = "auto" ]; then
              expected_current_revision="${current_revision}"
            fi

            if ! safe_revision_token "${expected_current_revision}"; then
              echo "::error::Alembic expected current revision is unsafe"
              exit 1
            fi

            echo "Alembic current revision before migration: ${current_revision}"
            echo "Alembic target revision: ${target_revision}"

            if [ "${current_revision}" != "${expected_current_revision}" ]; then
              echo "Alembic current revision mismatch"
              exit 1
            fi

            if [ "${FINANCE_AUTO_DB_BACKUP}" = "true" ]; then
              create_finance_db_backup "${current_revision}" "${target_revision}"
            else
              echo "Using operator-supplied backup proof from workflow_dispatch."
            fi

            "${alembic_python}" -m alembic -c alembic.ini upgrade "${target_revision}"
            after_revision="$(read_single_alembic_revision current)"
            if [ "${after_revision}" != "${target_revision}" ]; then
              echo "Alembic target revision mismatch after upgrade"
              exit 1
            fi
          fi

          ln -sfnT "${release_dir}" "${current}.next"
          mv -Tf "${current}.next" "${current}"
          test "$(readlink -f "${current}")" = "${release_dir}"

          if [ "${FINANCE_RESTART_BACKEND}" = "true" ]; then
            systemctl restart "${FINANCE_BACKEND_SERVICE}"
            if ! systemctl is-active --quiet "${FINANCE_BACKEND_SERVICE}"; then
              echo "::error::${FINANCE_BACKEND_SERVICE} is not active after restart"
              systemctl show "${FINANCE_BACKEND_SERVICE}" \
                -p ActiveState -p SubState -p Result -p ExecMainStatus \
                -p FragmentPath -p ExecStart -p WorkingDirectory -p MainPID \
                --no-pager || true
              exit 1
            fi
          else
            echo "Backend release staged and symlinked; service restart skipped by input."
          fi

          routes_ready="false"
          for attempt in {1..24}; do
            if curl -fsS --max-time 10 http://127.0.0.1/finance-api/health >/dev/null \
              && curl -fsS --max-time 10 http://127.0.0.1/finance/ >/dev/null; then
              routes_ready="true"
              break
            fi

            echo "Waiting for Finance routes after backend deploy, attempt ${attempt}/24..."
            sleep 5
          done

          if [ "${routes_ready}" != "true" ]; then
            echo "::error::Finance routes did not become healthy after backend deploy"
            systemctl show "${FINANCE_BACKEND_SERVICE}" \
              -p ActiveState -p SubState -p Result -p ExecMainStatus \
              -p FragmentPath -p ExecStart -p WorkingDirectory -p MainPID \
              --no-pager || true
            exit 1
          fi
          REMOTE
