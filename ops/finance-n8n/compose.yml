name: finance-n8n

services:
  postgres:
    image: ${FINANCE_POSTGRES_IMAGE:?required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FINANCE_N8N_POSTGRES_DB:?required}
      POSTGRES_USER: ${FINANCE_N8N_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${FINANCE_N8N_POSTGRES_PASSWORD:?required}
      FINANCE_GATEWAY_DB: ${FINANCE_GATEWAY_DB:?required}
      FINANCE_GATEWAY_DB_USER: ${FINANCE_GATEWAY_DB_USER:?required}
      FINANCE_GATEWAY_DB_PASSWORD: ${FINANCE_GATEWAY_DB_PASSWORD:?required}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - finance_n8n_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/gateway-schema.sql:/opt/finance/gateway-schema.sql:ro
    networks:
      - finance_n8n_private
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 160
    mem_limit: 768m
    cpus: 0.75

  n8n:
    image: ${FINANCE_N8N_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${FINANCE_N8N_POSTGRES_DB:?required}
      DB_POSTGRESDB_USER: ${FINANCE_N8N_POSTGRES_USER:?required}
      DB_POSTGRESDB_PASSWORD: ${FINANCE_N8N_POSTGRES_PASSWORD:?required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_HOST: finance-n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://finance-n8n:5678/
      N8N_EDITOR_BASE_URL: http://127.0.0.1:${FINANCE_N8N_LISTEN_PORT:-5680}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_METRICS: "true"
      N8N_LOG_LEVEL: warn
      N8N_LOG_OUTPUT: console
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_PAYLOAD_SIZE_MAX: "1"
      NODES_EXCLUDE: '["n8n-nodes-base.code","n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile"]'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      NODE_FUNCTION_ALLOW_BUILTIN: ""
      NODE_FUNCTION_ALLOW_EXTERNAL: ""
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n
      TZ: ${TZ:-Europe/Moscow}
      GENERIC_TIMEZONE: ${TZ:-Europe/Moscow}
    ports:
      - 127.0.0.1:${FINANCE_N8N_LISTEN_PORT:?required}:5678
    volumes:
      - finance_n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/imports:ro
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    networks:
      - finance_n8n_private
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 220
    mem_limit: 1024m
    cpus: 1.0

  analysis-gateway:
    image: ${FINANCE_GATEWAY_IMAGE:?required}
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        NODE_BASE_IMAGE: ${FINANCE_GATEWAY_NODE_BASE_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FINANCE_GATEWAY_DB: ${FINANCE_GATEWAY_DB:?required}
      FINANCE_GATEWAY_DB_USER: ${FINANCE_GATEWAY_DB_USER:?required}
      FINANCE_GATEWAY_DB_PASSWORD: ${FINANCE_GATEWAY_DB_PASSWORD:?required}
      FINANCE_GATEWAY_TOKEN: ${FINANCE_GATEWAY_TOKEN:?required}
      FINANCE_GATEWAY_QUEUE_KEY: ${FINANCE_GATEWAY_QUEUE_KEY:?required}
      FINANCE_INGRESS_HMAC_SECRET: ${FINANCE_INGRESS_HMAC_SECRET:?required}
      FINANCE_CALLBACK_HMAC_SECRET: ${FINANCE_CALLBACK_HMAC_SECRET:?required}
      FINANCE_BACKEND_API_PREFIX: ${FINANCE_BACKEND_API_PREFIX:-/api/v1}
      FINANCE_CALLBACK_PROXY_PORT: ${FINANCE_CALLBACK_PROXY_PORT:?required}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?required}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
    extra_hosts:
      - finance-host-callback:${FINANCE_DELIVERY_BRIDGE_GATEWAY:?required}
    networks:
      - finance_n8n_private
      - finance_host_bridge
      - finance_n8n_egress
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 80
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  finance_n8n_private:
    internal: true
  finance_n8n_egress:
    driver: bridge
  finance_host_bridge:
    external: true
    name: ${FINANCE_DELIVERY_BRIDGE_NAME:?required}

volumes:
  finance_n8n_postgres_data:
  finance_n8n_data:
