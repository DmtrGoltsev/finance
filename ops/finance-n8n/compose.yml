name: finance-n8n

services:
  postgres:
    image: postgres:16.10-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FINANCE_N8N_POSTGRES_DB:?required}
      POSTGRES_USER: ${FINANCE_N8N_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${FINANCE_N8N_POSTGRES_PASSWORD:?required}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - finance_n8n_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - finance_n8n_private
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 160
    mem_limit: 768m
    cpus: 0.75

  n8n:
    image: ${FINANCE_N8N_IMAGE:-n8nio/n8n:2.39.8}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${FINANCE_N8N_POSTGRES_DB:?required}
      DB_POSTGRESDB_USER: ${FINANCE_N8N_POSTGRES_USER:?required}
      DB_POSTGRESDB_PASSWORD: ${FINANCE_N8N_POSTGRES_PASSWORD:?required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_HOST: finance-n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://finance-n8n:5678/
      N8N_EDITOR_BASE_URL: http://127.0.0.1:${FINANCE_N8N_LISTEN_PORT:-5680}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_METRICS: "true"
      N8N_LOG_LEVEL: warn
      N8N_LOG_OUTPUT: console
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      NODE_FUNCTION_ALLOW_EXTERNAL: ""
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n
      FINANCE_INGRESS_HMAC_SECRET: ${FINANCE_INGRESS_HMAC_SECRET:?required}
      FINANCE_CALLBACK_HMAC_SECRET: ${FINANCE_CALLBACK_HMAC_SECRET:?required}
      FINANCE_BACKEND_INTERNAL_URL: ${FINANCE_BACKEND_INTERNAL_URL:-http://finance-backend:8000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?required}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      NEWS_SOURCES_ENABLED: "false"
      TZ: ${TZ:-Europe/Moscow}
      GENERIC_TIMEZONE: ${TZ:-Europe/Moscow}
    ports:
      - ${FINANCE_N8N_LISTEN_ADDRESS:-127.0.0.1}:${FINANCE_N8N_LISTEN_PORT:-5680}:5678
    volumes:
      - finance_n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/imports:ro
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    networks:
      - finance_n8n_private
      - finance_backend_bridge
      - finance_n8n_egress
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 220
    mem_limit: 1024m
    cpus: 1.0

networks:
  finance_n8n_private:
    internal: true
  finance_n8n_egress:
    driver: bridge
  finance_backend_bridge:
    external: true
    name: finance_backend_internal

volumes:
  finance_n8n_postgres_data:
  finance_n8n_data:
