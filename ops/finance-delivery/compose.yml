name: finance-delivery
services:
  worker:
    image: ${FINANCE_DELIVERY_IMAGE:-finance-delivery:20260920}
    build:
      context: ../..
      dockerfile: ops/finance-delivery/Dockerfile
    restart: unless-stopped
    env_file:
      - ${FINANCE_DELIVERY_ENV_FILE:?external env file required}
    environment:
      FINANCE_BACKEND_DELIVERY_HEALTH_HOST: 0.0.0.0
    volumes:
      - ${FINANCE_DELIVERY_SECRETS_DIR:?external secrets directory required}:/run/secrets:ro
    networks: [backend, egress]
    read_only: true
    tmpfs: [/tmp:size=16m,noexec,nosuid,nodev]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 180s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  backend:
    external: true
    name: finance_backend_internal
  egress:
    driver: bridge
